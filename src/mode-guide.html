<title>Check Mate · Οδηγός</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans+Extra+Condensed:wght@600;800&family=Commissioner:wght@400;500;600&family=Fira+Mono:wght@500&display=swap&subset=greek">
<style>
/* Layout: phone app — sticky header, one column of steps / tips / venue card, fixed bottom tab bar. Same palette as Check Mate. */
:root{
  --ink:#14213a; --bg:#f3f5f9; --surface:#ffffff; --line:#d9dfea; --muted:#5d6b84;
  --accent:#f0821e; --accent-ink:#ffffff; --blue:#2a7fd4; --blue-bg:#e4effb; --bad:#c43a2c;
  --court:#dfe8f5; --court-line:#ffffff; --head:#14213a; --head-ink:#f3f5f9;
  --f-display:"Fira Sans Extra Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Commissioner",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Fira Mono",ui-monospace,Menlo,Consolas,monospace;
  --tabh:62px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ink:#e8edf6; --bg:#0e1524; --surface:#162034; --line:#2a3650; --muted:#97a3ba;
  --accent:#ff9a3d; --accent-ink:#1a1206; --blue:#5aa5f0; --blue-bg:#16283f; --bad:#ff7b6b;
  --court:#1c2a45; --court-line:#3a4f7a; --head:#0a101d; --head-ink:#e8edf6; color-scheme:dark}}
:root[data-theme="dark"]{
  --ink:#e8edf6; --bg:#0e1524; --surface:#162034; --line:#2a3650; --muted:#97a3ba;
  --accent:#ff9a3d; --accent-ink:#1a1206; --blue:#5aa5f0; --blue-bg:#16283f; --bad:#ff7b6b;
  --court:#1c2a45; --court-line:#3a4f7a; --head:#0a101d; --head-ink:#e8edf6; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
[hidden]{display:none!important}
.g-wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.g-top{position:sticky;top:0;z-index:5;background:var(--head);color:var(--head-ink);padding-top:env(safe-area-inset-top,0px)}
.g-top .g-wrap{display:flex;align-items:center;gap:12px;padding-block:12px}
.g-brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.g-brand b{white-space:nowrap;font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1;text-transform:uppercase;letter-spacing:.01em}
.g-brand b span{color:var(--accent)}
.g-brand small{display:block;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;opacity:.7;margin-top:3px}
.g-sp{flex:1}
.g-pill{border:1.5px solid currentColor;background:transparent;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:inherit;text-decoration:none;white-space:nowrap}
.g-pill[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
main.g-main{padding-bottom:calc(var(--tabh) + 70px + env(safe-area-inset-bottom,0px))}
.g-h1{font-family:var(--f-display);font-weight:800;font-size:32px;line-height:1.05;margin:22px 0 4px;text-transform:uppercase;text-wrap:balance}
.g-lede{color:var(--muted);margin:0 0 18px;max-width:60ch}
.g-sec{font-family:var(--f-display);font-weight:800;font-size:20px;text-transform:uppercase;margin:26px 0 10px}
.g-list{display:grid;gap:14px}
.g-step{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.g-media{background:var(--court);aspect-ratio:16/10;max-width:100%}
.g-media img,.g-media svg{width:100%;height:100%;display:block;object-fit:cover}
.g-body{padding:14px 16px 16px;display:grid;gap:6px;min-width:0}
.g-num{font-family:var(--f-mono);font-size:13px;color:var(--accent)}
.g-step h2,.g-tip h3{font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1.15;margin:0;text-wrap:balance}
.g-txt{white-space:pre-line;margin:0;overflow-wrap:anywhere}
.g-chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.g-chip{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px}
.g-chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.g-tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--blue-bg);color:var(--blue)}
.g-tip{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:12px;padding:14px 16px;display:grid;gap:8px;min-width:0}
.g-tip img{border-radius:10px;width:100%;display:block}
.g-tools{display:flex;flex-wrap:wrap;gap:8px;padding-top:8px;border-top:1px dashed var(--line);margin-top:4px}
.g-tb{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600}
.g-tb:disabled{opacity:.4;cursor:default}
.g-tb.del{color:var(--bad)}
.g-tb.del.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.g-add{width:100%;border:2px dashed var(--blue);color:var(--blue);background:transparent;border-radius:14px;padding:14px;font-weight:600}
.g-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 16px;font-weight:600;font-size:15px;text-decoration:none;background:var(--accent);color:var(--accent-ink)}
.g-btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.g-btn svg{width:20px;height:20px}
.g-field{display:grid;gap:6px}
.g-field label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.g-in{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px}
textarea.g-in{min-height:120px;resize:vertical}
.g-picker{display:grid;gap:10px;margin-bottom:16px}
.g-mine{display:grid;gap:8px;margin-bottom:20px}
.g-match{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--blue);border-radius:12px;padding:10px 14px}
.g-match[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.g-match .w{font-family:var(--f-mono);font-size:13px;color:var(--muted);grid-row:span 2}
.g-match .t{font-family:var(--f-display);font-weight:800;font-size:17px;text-transform:uppercase;line-height:1.1;overflow-wrap:anywhere}
.g-match .v{font-size:13.5px;color:var(--muted)}
.g-court{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.g-court .hd{background:var(--head);color:var(--head-ink);padding:16px;display:flex;gap:14px;align-items:center}
.g-code{font-family:var(--f-mono);font-size:26px;letter-spacing:.06em;background:var(--accent);color:#fff;border-radius:8px;padding:4px 10px;line-height:1.2;flex:none}
.g-court .hd h2{font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1.1;margin:0;text-transform:uppercase;text-wrap:balance;overflow-wrap:anywhere}
.g-court .hd p{margin:2px 0 0;opacity:.75;font-size:14px}
.g-court .bd{padding:16px;display:grid;gap:12px}
.g-kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:baseline;margin:0}
.g-kv dt{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.g-kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.g-row{display:flex;flex-wrap:wrap;gap:10px}
.g-row .g-btn{flex:1 1 180px}
.g-mini{display:grid;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:18px}
.g-mini button{display:grid;grid-template-columns:76px 1fr;gap:12px;align-items:center;text-align:left;border:0;border-top:1px solid var(--line);background:transparent;padding:10px 14px}
.g-mini button:first-child{border-top:0}
.g-mini button[aria-current="true"]{background:var(--blue-bg)}
.g-mini .c{font-family:var(--f-mono);font-size:14px;color:var(--blue)}
.g-mini .c.none{color:var(--muted)}
.g-mini .n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g-empty{color:var(--muted);text-align:center;padding:26px 14px;border:1.5px dashed var(--line);border-radius:14px;display:grid;gap:10px;justify-items:center}
.g-empty strong{color:var(--ink)}
.g-tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.g-tabs .in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);height:var(--tabh)}
.g-tabs a{position:relative;display:grid;place-items:center;align-content:center;gap:2px;text-decoration:none;color:var(--muted);font-size:12px;font-weight:600}
.g-tabs a svg{width:24px;height:24px}
.g-tabs a[aria-current="page"]{color:var(--accent)}
.g-tabs a[aria-current="page"]::before{content:"";position:absolute;top:0;width:28px;height:3px;background:var(--accent);border-radius:0 0 3px 3px}
.g-sheet{position:fixed;inset:0;z-index:60;background:rgba(10,15,30,.55);display:flex;align-items:flex-end;justify-content:center}
.g-pane{background:var(--bg);width:100%;max-width:680px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px}
.g-pane h2{font-family:var(--f-display);font-weight:800;font-size:24px;text-transform:uppercase;margin:0}
.g-imgprev{display:grid;gap:8px;justify-items:start}
.g-imgprev img{border-radius:10px;max-height:200px;object-fit:contain;background:var(--court)}
.toast{position:fixed;left:50%;bottom:calc(var(--tabh) + 20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:80;max-width:90%;text-align:center}
#cm-dock{bottom:calc(var(--tabh) + 12px + env(safe-area-inset-bottom,0px))!important}
</style>

<div class="g-app" id="gapp" lang="el"></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/\s+/g," ").trim();
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status"); t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }
const today = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
const fmtDate = s => s ? s.split("-").reverse().join("/") : "";

/* first content an admin can load with one tap (edit or delete it afterwards) */
const START_STEPS = [
  {title:"Συνολική διάταξη", text:"Ενδεικτικό σχέδιο: κάμερες στους ορθοστάτες του φιλέ που κοιτάνε κατά μήκος της ταινίας, και κάμερες στις γωνίες για τις γραμμές.\nΑντικατάστησέ το με φωτογραφία του δικού σας στησίματος.", diagram:true},
  {title:"Έλεγχος εξοπλισμού πριν φύγεις", text:"• Κάμερες και φορτισμένες μπαταρίες (+1 εφεδρική)\n• Κάρτες μνήμης, άδειες\n• Σφιγκτήρες / βάσεις, ιμάντες velcro, δεματικά (tie-wraps)\n• Καλώδια, πολύπριζο, router, tablet ελέγχου\n• Ψαλίδι ή κόφτης για τα δεματικά"},
  {title:"Δέσιμο κάμερας στο φιλέ", text:"Στερέωσε την κάμερα σε σταθερό σημείο του ορθοστάτη ή στο πάνω συρματόσχοινο, όχι πάνω στη λευκή ταινία που κουνιέται όταν χτυπάει η μπάλα.\nΧρησιμοποίησε δύο σημεία στήριξης (πάνω και κάτω) ώστε να μη γυρίζει.\nΤράβα ελαφρά την κάμερα με το χέρι: αν κουνιέται, σφίξε ξανά."},
  {title:"Ύψος και γωνία λήψης", text:"Γράψε εδώ το ύψος που ορίζει το πρωτόκολλο (π.χ. πόσα εκ. πάνω από την άνω ταινία).\nΤο κάδρο πρέπει να δείχνει ολόκληρη την ταινία του φιλέ και την αντένα από την πλευρά της κάμερας."},
  {title:"Καλώδια και σύνδεση", text:"Πέρασε τα καλώδια κατά μήκος του ορθοστάτη και κόλλησέ τα στο δάπεδο έξω από τον αγωνιστικό χώρο.\nΈλεγξε ότι κάθε κάμερα εμφανίζεται στο tablet ελέγχου."},
  {title:"Δοκιμαστική λήψη", text:"Κάνε μια σύντομη δοκιμαστική εγγραφή με μπάλα που ακουμπά την ταινία και την αντένα.\nΔες την επανάληψη σε αργή κίνηση πριν δώσεις το ΟΚ στους διαιτητές."}
];
const START_TIPS = [
  {cat:"Στερέωση", title:"Δεματικά διπλά", text:"Βάλε πάντα δύο δεματικά σε κάθε σημείο στήριξης. Αν σπάσει το ένα στη διάρκεια του σετ, η κάμερα μένει στη θέση της."},
  {cat:"Στερέωση", title:"Μακριά από την ταινία", text:"Η λευκή ταινία του φιλέ δονείται σε κάθε επαφή. Στερέωση πάνω της σημαίνει κουνημένη εικόνα στο replay."},
  {cat:"Κάδρο", title:"Αντένα ολόκληρη στο κάδρο", text:"Έλεγξε ότι φαίνεται όλη η αντένα, από την ταινία ως την κορυφή."},
  {cat:"Ασφάλεια", title:"Τίποτα μέσα στον αγωνιστικό χώρο", text:"Καλώδια και βάσεις μένουν έξω από την ελεύθερη ζώνη. Ζήτα από τον 1ο διαιτητή να ελέγξει το στήσιμο πριν το ζέσταμα."},
  {cat:"Πριν τον αγώνα", title:"Έλα νωρίς", text:"Υπολόγισε χρόνο για στήσιμο, δοκιμή και διορθώσεις πριν ανοίξει το γήπεδο για ζέσταμα."}
];

const ICON = {
  setup:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="13" height="10" rx="2"/><path d="M16 11l5-3v8l-5-3"/></svg>',
  tips:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/></svg>',
  venues:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.1-7-11a7 7 0 0 1 14 0c0 4.9-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>'
};
const TABS = [["setup","Στήσιμο"],["tips","Tips"],["venues","Γήπεδα"]];

let db=null, me=null, isAdmin=false, edit=false;
let steps=[], tips=[], venues=[], myItems=[], ready={steps:false,tips:false,venues:false};
let tab = (location.hash||"").slice(1); if(!TABS.some(t=>t[0]===tab)) tab = "setup";
let tipCat = "Όλα", venueId = null, filter = "", sheet = null;
const wantVenue = new URLSearchParams(location.search).get("venue");
if(wantVenue) tab = "venues";
try{ if(!wantVenue) venueId = localStorage.getItem("cm-guide-venue"); }catch{}

function diagram(){
  const cam=(x,y,r,l)=>`<g transform="translate(${x} ${y})"><g transform="rotate(${r})"><path d="M0 0 L26 -10 L26 10 Z" fill="var(--accent)" opacity=".35"/><rect x="-8" y="-6" width="14" height="12" rx="2" fill="var(--ink)"/></g><text x="0" y="${y<100?-12:22}" text-anchor="middle" font-size="11" font-family="var(--f-mono)" fill="var(--ink)">${l}</text></g>`;
  return `<svg viewBox="0 0 400 250" role="img" aria-label="Ενδεικτική κάτοψη γηπέδου με θέσεις καμερών">
  <rect width="400" height="250" fill="var(--court)"/>
  <rect x="56" y="62" width="288" height="144" fill="none" stroke="var(--court-line)" stroke-width="3"/>
  <line x1="152" y1="62" x2="152" y2="206" stroke="var(--court-line)" stroke-width="2"/><line x1="248" y1="62" x2="248" y2="206" stroke="var(--court-line)" stroke-width="2"/>
  <line x1="200" y1="44" x2="200" y2="224" stroke="var(--ink)" stroke-width="4"/>
  <circle cx="200" cy="44" r="5" fill="var(--bad)"/><circle cx="200" cy="224" r="5" fill="var(--bad)"/>
  <text x="208" y="240" font-size="10" fill="var(--muted)" font-family="var(--f-body)">φιλέ / αντένες</text>
  ${cam(200,30,90,"C1")}${cam(200,238,-90,"C2")}${cam(40,48,35,"C3")}${cam(360,220,-145,"C4")}
  <text x="12" y="20" font-size="11" font-weight="600" fill="var(--muted)" font-family="var(--f-body)" letter-spacing="1">ΕΝΔΕΙΚΤΙΚΟ</text></svg>`;
}

function mapsUrl(v){
  if(v.maps && /^https?:\/\//.test(v.maps)) return v.maps;
  const q = v.address || [v.name, v.city].filter(Boolean).join(", ");
  return "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(q);
}
const venueFor = name => venues.find(v => norm(v.name) === norm(name));

function tools(kind, i, len){
  if(!edit) return "";
  const mv = kind!=="venues" ? `<button class="g-tb" data-act="up" data-k="${kind}" data-i="${i}" ${i===0?"disabled":""} aria-label="Μετακίνηση πάνω">↑</button>
    <button class="g-tb" data-act="down" data-k="${kind}" data-i="${i}" ${i===len-1?"disabled":""} aria-label="Μετακίνηση κάτω">↓</button>` : "";
  return `<div class="g-tools"><button class="g-tb" data-act="edit" data-k="${kind}" data-i="${i}">✎ Επεξεργασία</button>${mv}
    <button class="g-tb del" data-act="del" data-k="${kind}" data-i="${i}">Διαγραφή</button></div>`;
}
function emptyBox(title, sub, extra=""){ return `<div class="g-empty"><strong>${title}</strong><div>${sub}</div>${extra}</div>`; }

function viewSetup(){
  if(!ready.steps) return `<h1 class="g-h1">Στήσιμο video check</h1><p class="g-lede">Φόρτωση…</p>`;
  const n = steps.length;
  const empty = isAdmin
    ? emptyBox("Δεν υπάρχουν βήματα ακόμα", "Πρόσθεσε το πρώτο βήμα ή φόρτωσε ένα αρχικό πρόχειρο που αλλάζεις μετά.", `<button class="g-btn" data-act="seed" data-k="steps">Φόρτωση αρχικού προχείρου</button>`)
    : emptyBox("Δεν υπάρχουν βήματα ακόμα", "Ο διαχειριστής θα τα προσθέσει σύντομα.");
  return `<h1 class="g-h1">Στήσιμο video check</h1><p class="g-lede">Τα βήματα με τη σειρά, από τον εξοπλισμό ως τη δοκιμαστική λήψη.</p>
  <div class="g-list">${n ? steps.map((s,i)=>`<article class="g-step">
    ${s.img?`<div class="g-media"><img src="${s.img}" alt="${esc(s.title)}" loading="lazy"></div>`:s.diagram?`<div class="g-media">${diagram()}</div>`:""}
    <div class="g-body"><span class="g-num">ΒΗΜΑ ${i+1} / ${n}</span><h2>${esc(s.title)}</h2><p class="g-txt">${esc(s.text)}</p>${tools("steps",i,n)}</div></article>`).join("") : empty}
  ${edit?`<button class="g-add" data-act="new" data-k="steps">+ Νέο βήμα</button>`:""}</div>`;
}

function viewTips(){
  if(!ready.tips) return `<h1 class="g-h1">Tips</h1><p class="g-lede">Φόρτωση…</p>`;
  const cats = ["Όλα", ...new Set(tips.map(t=>t.cat).filter(Boolean))];
  if(!cats.includes(tipCat)) tipCat = "Όλα";
  const list = tips.map((t,i)=>[t,i]).filter(([t])=>tipCat==="Όλα"||t.cat===tipCat);
  const empty = !tips.length
    ? (isAdmin ? emptyBox("Δεν υπάρχουν tips ακόμα", "Πρόσθεσε το πρώτο ή φόρτωσε ένα αρχικό πρόχειρο.", `<button class="g-btn" data-act="seed" data-k="tips">Φόρτωση αρχικού προχείρου</button>`)
               : emptyBox("Δεν υπάρχουν tips ακόμα", "Ο διαχειριστής θα τα προσθέσει σύντομα."))
    : emptyBox("Κανένα tip σε αυτή την κατηγορία", "");
  return `<h1 class="g-h1">Tips</h1><p class="g-lede">Μικρές λεπτομέρειες που γλιτώνουν προβλήματα στον αγώνα.</p>
  ${tips.length?`<div class="g-chips" role="toolbar" aria-label="Κατηγορίες">${cats.map(c=>`<button class="g-chip" data-act="cat" data-c="${esc(c)}" aria-pressed="${c===tipCat}">${esc(c)}</button>`).join("")}</div>`:""}
  <div class="g-list">${list.length ? list.map(([t,i])=>`<article class="g-tip">${t.cat?`<span><span class="g-tag">${esc(t.cat)}</span></span>`:""}<h3>${esc(t.title)}</h3>
    ${t.img?`<img src="${t.img}" alt="${esc(t.title)}" loading="lazy">`:""}<p class="g-txt">${esc(t.text)}</p>${tools("tips",i,tips.length)}</article>`).join("") : empty}
  ${edit?`<button class="g-add" data-act="new" data-k="tips">+ Νέο tip</button>`:""}</div>`;
}

function viewVenues(){
  if(!ready.venues) return `<h1 class="g-h1">Γήπεδα</h1><p class="g-lede">Φόρτωση…</p>`;
  const t = today();
  const upcoming = myItems.filter(i=>i.date>=t).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,5);
  const sorted = venues.slice().sort((a,b)=>(a.code||"~").localeCompare(b.code||"~","el") || a.name.localeCompare(b.name,"el"));
  const f = norm(filter);
  const shown = f ? sorted.filter(v=>norm([v.code,v.name,v.city].join(" ")).includes(f)) : sorted;
  const cur = venues.find(v=>v.id===venueId);
  const ci = cur ? venues.indexOf(cur) : -1;
  return `<h1 class="g-h1">Γήπεδα</h1><p class="g-lede">Διάλεξε γήπεδο για να δεις το αρκτικόλεξό του και να ανοίξεις οδηγίες στο Google Maps.</p>
  ${upcoming.length?`<h2 class="g-sec">Οι επόμενοι αγώνες μου</h2><div class="g-mine">${upcoming.map(i=>{ const v=venueFor(i.venue);
    return `<button class="g-match" data-act="pickname" data-n="${esc(i.venue)}" aria-current="${!!(v&&v.id===venueId)}"><span class="w">${esc(fmtDate(i.date).slice(0,5))}<br>${esc(i.time||"")}</span>
      <span class="t">${esc([i.home,i.away].filter(Boolean).join(" – ")||"Αγώνας")}</span><span class="v">📍 ${esc(i.venue||"—")}${v&&v.code?` · <b>${esc(v.code)}</b>`:""}</span></button>`; }).join("")}</div>`:""}
  <div class="g-picker">
    <div class="g-field"><label for="gq">Αναζήτηση</label><input class="g-in" id="gq" type="search" placeholder="Κωδικός, όνομα ή πόλη" value="${esc(filter)}" autocomplete="off"></div>
    <div class="g-field"><label for="gsel">Γήπεδο (${shown.length})</label><select class="g-in" id="gsel"><option value="">— Επίλεξε γήπεδο —</option>
      ${shown.map(v=>`<option value="${v.id}" ${v.id===venueId?"selected":""}>${v.code?esc(v.code)+" — ":""}${esc(v.name)}</option>`).join("")}</select></div>
  </div>
  ${cur?`<article class="g-court"><div class="hd"><span class="g-code">${esc(cur.code||"—")}</span><div><h2>${esc(cur.name)}</h2>${cur.city?`<p>${esc(cur.city)}</p>`:""}</div></div>
    <div class="bd"><dl class="g-kv">${cur.address?`<dt>Διεύθυνση</dt><dd>${esc(cur.address)}</dd>`:""}${cur.notes?`<dt>Σημειώσεις</dt><dd class="g-txt">${esc(cur.notes)}</dd>`:""}</dl>
    <div class="g-row"><a class="g-btn" href="${esc(mapsUrl(cur))}" target="_blank" rel="noopener">${ICON.venues} Οδηγίες Google Maps</a><button class="g-btn ghost" data-act="copy">Αντιγραφή διεύθυνσης</button></div>
    ${(!cur.code||!cur.address)&&isAdmin&&!edit?`<p class="g-lede" style="margin:0">Λείπει ${!cur.code&&!cur.address?"κωδικός και διεύθυνση":!cur.code?"ο κωδικός":"η διεύθυνση"}. Πάτα ✎ Επεξεργασία για να τα συμπληρώσεις.</p>`:""}
    ${tools("venues",ci,venues.length)}</div></article>`
   : wantVenue && !venueFor(wantVenue) ? emptyBox(`Το «${esc(wantVenue)}» δεν είναι στη λίστα γηπέδων`, isAdmin?"Πρόσθεσέ το από το ✎ Επεξεργασία.":"Ενημέρωσε τον διαχειριστή.")
   : venues.length ? emptyBox("Επίλεξε γήπεδο από τη λίστα","") : emptyBox("Δεν υπάρχουν γήπεδα ακόμα", isAdmin?"Πρόσθεσέ τα από το ✎ Επεξεργασία, ή εισάγοντας το πρόγραμμα στο Check Mate.":"Ο διαχειριστής θα τα προσθέσει σύντομα.")}
  <div class="g-mini">${shown.map(v=>`<button data-act="pick" data-id="${v.id}" aria-current="${v.id===venueId}"><span class="c ${v.code?"":"none"}">${esc(v.code||"—")}</span><span class="n">${esc(v.name)}</span></button>`).join("")}</div>
  ${edit?`<div class="g-list" style="margin-top:14px"><button class="g-add" data-act="new" data-k="venues">+ Νέο γήπεδο</button><button class="g-add" data-act="import">Εισαγωγή κωδικών και διευθύνσεων</button></div>`:""}`;
}

const FORMS = {
  steps:[["title","Τίτλος βήματος","input"],["text","Οδηγίες","textarea"],["img","Φωτογραφία","image"]],
  tips:[["cat","Κατηγορία","input"],["title","Τίτλος","input"],["text","Κείμενο","textarea"],["img","Φωτογραφία (προαιρετική)","image"]],
  venues:[["name","Όνομα γηπέδου (όπως στο πρόγραμμα)","input"],["code","Αρκτικόλεξο / κωδικός","input"],["city","Πόλη / περιοχή","input"],["address","Διεύθυνση (για το Google Maps)","input"],["maps","Σύνδεσμος Google Maps (προαιρετικός)","input"],["notes","Σημειώσεις (πρόσβαση, πάρκινγκ, υπεύθυνος γηπέδου)","textarea"]]
};
const NAMES = {steps:"βήμα", tips:"tip", venues:"γήπεδο"};
const LIST = k => k==="steps"?steps:k==="tips"?tips:venues;
const COL = k => k==="steps"?"guide_steps":k==="tips"?"guide_tips":"venues";

function viewSheet(){
  if(!sheet) return "";
  if(sheet.kind==="import") return `<div class="g-sheet" data-act="closebg"><div class="g-pane" role="dialog" aria-modal="true" aria-labelledby="gsh">
    <h2 id="gsh">Κωδικοί και διευθύνσεις</h2>
    <p class="g-lede" style="margin:0">Ένα γήπεδο ανά γραμμή: <b>Όνομα ; Κωδικός ; Πόλη ; Διεύθυνση</b>. Μπορείς να επικολλήσεις στήλες από Excel. Αν το όνομα υπάρχει ήδη, ενημερώνεται· αλλιώς προστίθεται νέο γήπεδο.</p>
    <textarea class="g-in" id="gimp" style="min-height:200px" placeholder="Κλειστό Γυμναστήριο Γλυφάδας ; ΓΛΥ ; Γλυφάδα ; Οδός 1, Γλυφάδα"></textarea>
    <div class="g-row"><button class="g-btn" data-act="doimport">Αποθήκευση</button><button class="g-btn ghost" data-act="close">Άκυρο</button></div></div></div>`;
  const it = sheet.item;
  return `<div class="g-sheet" data-act="closebg"><div class="g-pane" role="dialog" aria-modal="true" aria-labelledby="gsh">
    <h2 id="gsh">${sheet.id?"Επεξεργασία: ":"Νέο "}${NAMES[sheet.kind]}</h2>
    ${FORMS[sheet.kind].map(([k,l,t])=>t==="image"
      ? `<div class="g-field"><label for="gf-${k}">${l}</label><div class="g-imgprev">${it.img?`<img src="${it.img}" alt="">`:""}<input type="file" id="gf-${k}" accept="image/*">${it.img?`<button class="g-tb del" data-act="rmimg" type="button">Αφαίρεση φωτογραφίας</button>`:""}</div></div>`
      : `<div class="g-field"><label for="gf-${k}">${l}</label>${t==="textarea"?`<textarea class="g-in" id="gf-${k}">${esc(it[k])}</textarea>`:`<input class="g-in" id="gf-${k}" value="${esc(it[k])}" ${k==="cat"?'list="gcats"':""}>`}</div>`).join("")}
    <datalist id="gcats">${[...new Set(tips.map(t=>t.cat).filter(Boolean))].map(c=>`<option value="${esc(c)}">`).join("")}</datalist>
    <div class="g-row"><button class="g-btn" data-act="saveitem">Αποθήκευση</button><button class="g-btn ghost" data-act="close">Άκυρο</button></div></div></div>`;
}

function render(){
  const sy = window.scrollY, gq = document.activeElement && document.activeElement.id==="gq" ? document.activeElement.selectionStart : null;
  $("gapp").innerHTML = `<header class="g-top"><div class="g-wrap">
      <a class="g-brand" href="checkmate.html" title="Πίσω στο Check Mate"><div><b>Check <span>Mate</span></b><small>Οδηγός στησίματος</small></div></a><span class="g-sp"></span>
      ${isAdmin?`<button class="g-pill" data-act="toggle" aria-pressed="${edit}">${edit?"Τέλος":"✎ Επεξεργασία"}</button>`:""}
      <a class="g-pill" href="checkmate.html">Αναθέσεις</a></div></header>
    <main class="g-main g-wrap">${tab==="setup"?viewSetup():tab==="tips"?viewTips():viewVenues()}</main>
    <nav class="g-tabs" aria-label="Ενότητες"><div class="in">${TABS.map(([k,l])=>`<a href="#${k}" data-act="tab" data-t="${k}" ${tab===k?'aria-current="page"':""}>${ICON[k]}${l}</a>`).join("")}</div></nav>
    ${viewSheet()}`;
  window.scrollTo(0, sy);
  if(gq!==null){ const q=$("gq"); if(q){ q.focus(); try{ q.setSelectionRange(gq,gq); }catch{} } }
}

function resizeImage(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>{ const im=new Image(); im.onload=()=>{
  const max=1200, s=Math.min(1,max/Math.max(im.width,im.height)); const c=document.createElement("canvas"); c.width=Math.round(im.width*s); c.height=Math.round(im.height*s);
  c.getContext("2d").drawImage(im,0,0,c.width,c.height); let q=.8, out=c.toDataURL("image/jpeg",q); while(out.length>700000 && q>.35){ q-=.1; out=c.toDataURL("image/jpeg",q); } res(out); };
  im.onerror=rej; im.src=r.result; }; r.onerror=rej; r.readAsDataURL(file); }); }

function readSheet(){ if(!sheet||!FORMS[sheet.kind]) return; for(const [k,,t] of FORMS[sheet.kind]){ if(t==="image") continue; const f=$("gf-"+k); if(f) sheet.item[k]=f.value.trim(); } }
const fail = () => toast("Η αποθήκευση απέτυχε. Έλεγξε τη σύνδεση και δοκίμασε ξανά.");
function pickVenue(id){ venueId=id||null; try{ localStorage.setItem("cm-guide-venue", venueId||""); }catch{} render(); }

async function onClick(ev){
  const el = ev.target.closest("[data-act]"); if(!el) return;
  const a = el.dataset.act, k = el.dataset.k, i = +el.dataset.i;
  if(a==="closebg" && ev.target!==el) return;
  switch(a){
    case "tab": ev.preventDefault(); tab=el.dataset.t; history.replaceState(null,"",location.pathname+"#"+tab); render(); window.scrollTo(0,0); break;
    case "toggle": edit=!edit; render(); break;
    case "cat": tipCat=el.dataset.c; render(); break;
    case "pick": pickVenue(el.dataset.id); window.scrollTo({top:0,behavior:"smooth"}); break;
    case "pickname": { const v=venueFor(el.dataset.n); if(v) pickVenue(v.id); else toast(`Το «${el.dataset.n}» δεν είναι στη λίστα γηπέδων`); break; }
    case "copy": { const v=venues.find(x=>x.id===venueId); const txt=v.address||v.name; try{ await navigator.clipboard.writeText(txt); toast("Η διεύθυνση αντιγράφηκε"); }catch{ toast(txt); } break; }
    case "up": case "down": { const arr=LIST(k), j=a==="up"?i-1:i+1; if(j<0||j>=arr.length) break;
      try{ const b=db.batch(); b.update(db.doc(`${COL(k)}/${arr[i].id}`),{order:j}); b.update(db.doc(`${COL(k)}/${arr[j].id}`),{order:i});
        arr.forEach((x,n)=>{ if(n!==i&&n!==j&&x.order!==n) b.update(db.doc(`${COL(k)}/${x.id}`),{order:n}); }); await b.commit(); }catch{ fail(); } break; }
    case "del":
      if(!el.classList.contains("armed")){ el.classList.add("armed"); el.textContent="Σίγουρα; Πάτα ξανά"; setTimeout(()=>{ if(el.isConnected){ el.classList.remove("armed"); el.textContent="Διαγραφή"; } },3000); }
      else { const it=LIST(k)[i]; try{ await db.doc(`${COL(k)}/${it.id}`).delete(); toast("Διαγράφηκε"); }catch{ fail(); } }
      break;
    case "new": sheet={kind:k, id:null, item:{}}; render(); break;
    case "edit": { const it=LIST(k)[i]; sheet={kind:k, id:it.id, item:{...it}}; render(); break; }
    case "import": sheet={kind:"import"}; render(); break;
    case "close": case "closebg": sheet=null; render(); break;
    case "rmimg": readSheet(); sheet.item.img=""; sheet.item.diagram=false; render(); break;
    case "saveitem": {
      readSheet(); const it=sheet.item, kind=sheet.kind;
      if(!(it.title||it.name)){ toast(kind==="venues"?"Συμπλήρωσε το όνομα του γηπέδου":"Συμπλήρωσε τίτλο"); break; }
      if(kind==="venues" && venues.some(v=>v.id!==sheet.id && norm(v.name)===norm(it.name))){ toast("Υπάρχει ήδη γήπεδο με αυτό το όνομα"); break; }
      const data={...it}; delete data.id;
      el.disabled=true;
      try{
        if(sheet.id) await db.doc(`${COL(kind)}/${sheet.id}`).set(data);
        else { if(kind!=="venues") data.order=LIST(kind).length; const ref=await db.collection(COL(kind)).add(data); if(kind==="venues") venueId=ref.id; }
        sheet=null; toast("Αποθηκεύτηκε"); render();
      }catch(e){ el.disabled=false; toast(/size|large|exceed/i.test(e?.message||"")?"Η φωτογραφία είναι πολύ μεγάλη. Δοκίμασε μικρότερη.":"Η αποθήκευση απέτυχε. Δοκίμασε ξανά."); }
      break; }
    case "doimport": {
      const rows=$("gimp").value.split("\n").map(l=>l.trim()).filter(Boolean).map(l=>l.split(/\t|;/).map(s=>s.trim())).filter(p=>p[0]);
      if(!rows.length){ toast("Η λίστα είναι κενή"); break; }
      el.disabled=true; let added=0, updated=0;
      try{
        for(let s=0; s<rows.length; s+=400){
          const b=db.batch();
          for(const p of rows.slice(s,s+400)){
            const d={}; if(p[1]) d.code=p[1]; if(p[2]) d.city=p[2]; if(p[3]) d.address=p[3];
            const ex=venueFor(p[0]);
            if(ex){ b.set(db.doc(`venues/${ex.id}`), d, {merge:true}); updated++; }
            else { b.set(db.collection("venues").doc(), {name:p[0], ...d}); added++; }
          }
          await b.commit();
        }
        sheet=null; toast(`Ενημερώθηκαν ${updated}, προστέθηκαν ${added}`); render();
      }catch{ el.disabled=false; fail(); }
      break; }
    case "seed": {
      const src=k==="steps"?START_STEPS:START_TIPS; el.disabled=true;
      try{ const b=db.batch(); src.forEach((x,n)=>b.set(db.collection(COL(k)).doc(), {...x, order:n})); await b.commit(); toast("Φορτώθηκε. Άλλαξέ το από το ✎ Επεξεργασία."); }
      catch{ el.disabled=false; fail(); }
      break; }
  }
}

(async () => {
  db = await claude.use("db");
  const u = await claude.use("user");
  me = u ? await u.me() : null;
  isAdmin = u ? !!(await u.canEdit()) : false;
  const g = $("gapp");
  g.addEventListener("click", onClick);
  g.addEventListener("change", async ev => {
    const t = ev.target;
    if(t.id==="gsel") pickVenue(t.value);
    else if(t.id==="gf-img" && t.files[0]){ readSheet(); try{ sheet.item.img = await resizeImage(t.files[0]); sheet.item.diagram=false; }catch{ toast("Δεν άνοιξε η εικόνα. Δοκίμασε JPG ή PNG."); } render(); }
  });
  g.addEventListener("input", ev => { if(ev.target.id==="gq"){ filter=ev.target.value; render(); } });
  addEventListener("hashchange", () => { const h=location.hash.slice(1); if(TABS.some(x=>x[0]===h) && h!==tab){ tab=h; render(); } });
  render();
  const byOrder = s => s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.order??1e9)-(b.order??1e9));
  const denied = name => () => { ready[name]=true; render(); };
  db.collection("guide_steps").onSnapshot(s=>{ steps=byOrder(s); ready.steps=true; render(); }, denied("steps"));
  db.collection("guide_tips").onSnapshot(s=>{ tips=byOrder(s); ready.tips=true; render(); }, denied("tips"));
  db.collection("venues").limit(1000).onSnapshot(s=>{
    venues=s.docs.map(d=>({id:d.id,...d.data()})); ready.venues=true;
    if(wantVenue && !venueId){ const v=venueFor(wantVenue); if(v) venueId=v.id; }
    render();
  }, denied("venues"));
  if(me?.id) db.collection(`mine/${me.id}/items`).limit(2000).onSnapshot(s=>{ myItems=s.docs.map(d=>({id:d.id,...d.data()})); render(); }, ()=>{});
})();
</script>
