<template id="tpl-log"><style>
/* Layout: scoreboard strip of totals, filter bar, match log as rows (cards on phone), slide-in form */
:root{
  --ink:#14213a; --bg:#f3f5f9; --surface:#ffffff; --line:#d9dfea; --muted:#5d6b84;
  --accent:#f0821e; --accent-ink:#ffffff; --blue:#2a7fd4;
  --good:#1d8a52; --good-bg:#e3f4ea; --warn:#b4530b; --warn-bg:#fdeedd;
  --sq:#e6eaf2;
  --f-display:"Fira Sans Extra Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Commissioner",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Fira Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ink:#e8edf6; --bg:#0e1524; --surface:#162034; --line:#2a3650; --muted:#97a3ba;
  --accent:#ff9a3d; --accent-ink:#1a1206; --blue:#5aa5f0;
  --good:#5fd394; --good-bg:#16352a; --warn:#ffb070; --warn-bg:#3a2614; --sq:#1c2840; color-scheme:dark}}
:root[data-theme="dark"]{
  --ink:#e8edf6; --bg:#0e1524; --surface:#162034; --line:#2a3650; --muted:#97a3ba;
  --accent:#ff9a3d; --accent-ink:#1a1206; --blue:#5aa5f0;
  --good:#5fd394; --good-bg:#16352a; --warn:#ffb070; --warn-bg:#3a2614; --sq:#1c2840; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:20px 60px;display:flex;flex-direction:column;gap:18px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* header */
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:52px;height:52px;flex:none;display:block}
.mark .m-bg{fill:var(--blue)}
.mark .m-cam{fill:#ffffff}
.mark .m-lens{fill:var(--blue)}
.mark .m-ring{fill:none;stroke:#ffffff;stroke-width:2.5}
.mark .m-chk{fill:none;stroke:var(--accent);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.mark .m-chk-o{fill:none;stroke:var(--bg);stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,5vw,34px);line-height:1;margin:0;letter-spacing:.01em;text-transform:uppercase}
h1 span{color:var(--accent)}
.sub{color:var(--muted);font-size:13px;margin-top:3px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.05)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.actions{display:flex;gap:8px;flex-wrap:wrap}

/* scoreboard */
.board{display:grid;grid-template-columns:repeat(5,1fr);background:var(--ink);color:var(--bg);border-radius:12px;overflow:hidden}
.cell{padding:14px 16px;border-right:1px solid color-mix(in srgb,var(--bg) 18%,transparent);min-width:0}
.cell:last-child{border-right:0}
.cell .k{font-size:11px;letter-spacing:.09em;text-transform:uppercase;opacity:.75}
.cell .v{font-family:var(--f-mono);font-size:24px;font-variant-numeric:tabular-nums;margin-top:4px;white-space:nowrap}
.cell .v.or{color:var(--accent)}
@media (max-width:720px){.board{grid-template-columns:repeat(2,1fr)}.cell{border-bottom:1px solid color-mix(in srgb,var(--bg) 18%,transparent)}.cell:first-child{grid-column:1/-1}}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.f input,.f select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.f.grow{flex:1 1 180px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:8px 12px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* list */
.log{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:92px minmax(0,1fr) 120px 90px 132px 40px;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.row.head{border-top:0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-block:10px;background:var(--sq)}
.date{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:14px}
.date small{display:block;color:var(--muted);font-size:12px}
.match{min-width:0}
.match b{font-weight:600;display:block;overflow-wrap:anywhere}
.match .meta{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.role{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:3px 9px;border-radius:999px;border:1px solid var(--line)}
.role.op{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.who{font-size:12.5px;color:var(--muted);margin-top:3px}
.fee{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.pay{border:1px solid transparent;border-radius:999px;padding:5px 10px;font-size:13px;font-weight:600;display:inline-flex;gap:6px;align-items:center;justify-self:start}
.pay.yes{background:var(--good-bg);color:var(--good)}
.pay.no{background:var(--warn-bg);color:var(--warn)}
.pay:not([disabled]):hover{border-color:currentColor}
.pay[disabled]{cursor:default}
.pay small{font-weight:400;opacity:.85}
.more{border:0;background:none;width:34px;height:34px;border-radius:8px;color:var(--muted);font-size:18px}
.more:not([disabled]):hover{background:var(--sq);color:var(--ink)}
.more[disabled]{cursor:not-allowed;opacity:.7}
@media (max-width:720px){
  .row.head{display:none}
  .row{grid-template-columns:minmax(0,1fr) auto;row-gap:8px}
  .row>.c-date{grid-column:1/-1}
  .row>.c-match{grid-column:1/-1}
  .fee{text-align:right}
}
.empty{padding:40px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty .board-art{width:72px;height:72px;border-radius:6px;background:conic-gradient(var(--sq) 25%,var(--line) 0 50%,var(--sq) 0 75%,var(--line) 0) 0 0/25% 25%}
.empty strong{color:var(--ink);font-size:16px}
.note{font-size:13px;color:var(--muted)}
.status{font-size:13px;color:var(--muted)}
.feebar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;font-size:13px}
.feebar[hidden]{display:none}
.feebar .f input{width:110px}
.feebar .t{font-weight:600;color:var(--ink);align-self:center}
.lockmsg{font-size:13px;color:var(--warn);background:var(--warn-bg);border-radius:8px;padding:8px 10px}

/* drawer form */
dialog{border:0;padding:0;border-radius:14px;background:var(--surface);color:var(--ink);width:min(560px,calc(100vw - 32px));max-height:calc(100dvh - 40px)}
dialog::backdrop{background:rgba(8,12,22,.55)}
.form{display:flex;flex-direction:column;gap:14px;padding:20px}
.form h2{font-family:var(--f-display);font-weight:800;text-transform:uppercase;font-size:24px;margin:0;letter-spacing:.02em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.grid2{grid-template-columns:1fr}}
.form .f input,.form .f select,.form .f textarea{width:100%}
.form textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;resize:vertical;min-height:60px}
.rolepick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rolepick label{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;gap:8px;align-items:center;font-weight:600;cursor:pointer;text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink)}
.rolepick input{accent-color:var(--accent)}
.rolepick label:has(input:checked){border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.check{display:flex;gap:8px;align-items:center;font-weight:600}
.check input{width:18px;height:18px;accent-color:var(--good)}
.check small{font-weight:400;color:var(--muted)}
.foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding-top:6px;border-top:1px solid var(--line)}
.danger{color:#c43a2c;border-color:transparent;background:none}
.confirm{display:flex;gap:8px;align-items:center;font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:10}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{transform:translate(-50%,8px);opacity:0}}}
</style>

<div class="wrap">
  <header>
    <div class="brand">
      <svg class="mark" viewBox="0 0 52 52" aria-hidden="true">
        <circle class="m-bg" cx="24" cy="26" r="23"/>
        <rect class="m-cam" x="9" y="18" width="22" height="16" rx="3"/>
        <path class="m-cam" d="M31 23 L39 19 V33 L31 29 Z"/>
        <circle class="m-lens" cx="20" cy="26" r="5"/>
        <circle class="m-ring" cx="20" cy="26" r="2"/>
        <path class="m-chk-o" d="M33 40 L39 46 L49 32"/>
        <path class="m-chk" d="M33 40 L39 46 L49 32"/>

      <div>
        <h1>Check <span>Mate</span></h1>

    <div class="actions">

  </header>

  <section class="board" aria-label="Σύνολα φιλτραρισμένων αγώνων">
    <div class="cell"><div class="k">Αγώνες</div><div class="v" id="sMatches">0</div></div>

    <div class="cell"><div class="k">Σύνολο αμοιβών</div><div class="v" id="sTotal">0 €</div></div>
    <div class="cell"><div class="k">Πληρώθηκαν</div><div class="v" id="sPaid">0 €</div></div>
    <div class="cell"><div class="k">Εκκρεμούν</div><div class="v or" id="sDue">0 €</div></div>
  </section>

  <section class="filters" aria-label="Φίλτρα">
    <div class="f"><label for="fSeason">Σεζόν</label><select id="fSeason"></select></div>
    <div class="f"><label for="fMonth">Μήνας</label><select id="fMonth"></select></div>
    <div class="f"><label for="fPerson">Άτομο</label><select id="fPerson"></select></div>
    <div class="f"><label>Θέση</label>
      <div class="seg" id="fRole"><button type="button" data-v="" aria-pressed="true">Όλες</button><button type="button" data-v="op" aria-pressed="false">Χειριστής</button><button type="button" data-v="as" aria-pressed="false">Βοηθός</button></div></div>
    <div class="f"><label>Πληρωμή</label>
      <div class="seg" id="fPaid"><button type="button" data-v="" aria-pressed="true">Όλα</button><button type="button" data-v="no" aria-pressed="false">Εκκρεμεί</button><button type="button" data-v="yes" aria-pressed="false">Πληρώθηκε</button></div></div>
    <div class="f grow"><label for="fSearch">Αναζήτηση</label><input id="fSearch" type="search" placeholder="Ομάδα, γήπεδο, διοργάνωση…"></div>
  </section>

  <section class="log" id="log" aria-live="polite">
    <div class="empty"><div class="board-art"></div><strong>Φόρτωση αγώνων…</strong></div>
  </section>
  <div class="status" id="status"></div>
  <form class="feebar" id="feeBar" hidden>
    <span class="t">Αμοιβές:</span>
    <div class="f"><label for="fbOp">Χειριστής (€)</label><input id="fbOp" type="number" min="0" step="0.5" inputmode="decimal"></div>
    <div class="f"><label for="fbAs">Βοηθός (€)</label><input id="fbAs" type="number" min="0" step="0.5" inputmode="decimal"></div>
    <button class="btn" type="submit">Αποθήκευση αμοιβών</button>
  </form>
</div>

<dialog id="dlg">
  <form class="form" id="frm" novalidate>
    <h2 id="frmTitle">Νέος αγώνας</h2>
    <div class="lockmsg" id="frmLock" hidden>🔒 Ο αγώνας έχει σημειωθεί ως πληρωμένος από τον διαχειριστή και δεν αλλάζει πλέον.</div>

    </fieldset>
    <div class="note" id="frmErr" hidden></div>
    <div class="foot">
      <div id="delWrap"></div>
      <div class="actions">
        <button class="btn" type="button" id="btnCancel">Άκυρο</button>
        <button class="btn primary" type="submit" id="btnSave">Αποθήκευση</button>
      </div>
    </div>
  </form>
</dialog>

<datalist id="dlTeams"></datalist><datalist id="dlComps"></datalist><datalist id="dlVenues"></datalist><datalist id="dlPeople"></datalist>

:root[data-theme="dark"]{
  --ink:#e8edf6; --bg:#0e1524; --surface:#162034; --line:#2a3650; --muted:#97a3ba;
  --accent:#ff9a3d; --accent-ink:#1a1206; --blue:#5aa5f0; --blue-bg:#16283f;
  --good:#5fd394; --good-bg:#16352a; --warn:#ffb070; --warn-bg:#3a2614; --bad:#ff7b6b; --sq:#1c2840; --head:#0a101d; --head-ink:#e8edf6; color-scheme:dark}

*{box-sizing:border-box}

.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:20px 60px;display:flex;flex-direction:column;gap:18px}

:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

html,body{overflow-x:clip}

  margin:-20px calc(50% - 50vw) 0;padding:calc(14px + env(safe-area-inset-top,0px)) calc(50vw - 50% + 16px) 14px}

.brand{display:flex;align-items:center;gap:12px}

h1{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,5vw,34px);line-height:1;margin:0;letter-spacing:.01em;text-transform:uppercase}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}

.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

.board{display:grid;grid-template-columns:repeat(5,1fr);background:var(--ink);color:var(--bg);border-radius:12px;overflow:hidden}

@media (max-width:720px){.board{grid-template-columns:repeat(5,minmax(0,1fr))}.board.four{grid-template-columns:repeat(4,minmax(0,1fr))}.cell{padding:8px 3px;text-align:center}.cell .k{font-size:8.5px;letter-spacing:0;line-height:1.25;overflow-wrap:anywhere}.cell .v{font-size:15px;margin-top:3px}}

.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label,.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.f input,.f select,.f textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.f.grow{flex:1 1 180px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:100px minmax(0,1fr) 240px 240px 40px;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.row.head{border-top:0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-block:10px;background:var(--sq)}
.viewsw{display:flex;align-items:center;gap:0;flex-wrap:wrap;margin-top:12px}
.viewsw button{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 14px;font-weight:600;font-size:14px}

.gwrap{overflow:auto;max-height:70vh}
table.grid{border-collapse:separate;border-spacing:0;table-layout:fixed;width:max-content;min-width:100%;font-size:13px}
table.grid th{position:sticky;top:0;z-index:2;background:var(--sq);color:var(--muted);font-size:11px;letter-spacing:.05em;text-transform:uppercase;text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);white-space:nowrap}

table.grid th:first-child{z-index:3;background:var(--sq)}
table.grid td{border-bottom:1px solid var(--line);border-right:1px solid color-mix(in srgb,var(--line) 60%,transparent);padding:0;background:var(--surface);transition:background .4s}

table.grid .gdd{position:absolute;right:2px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);width:22px;height:26px;border-radius:5px;font-size:12px;cursor:pointer}
table.grid .gdd:hover{background:var(--sq);color:var(--ink)}
.combo-list.gdrop{position:fixed;left:0;right:auto;top:auto;z-index:60;max-height:260px;overflow:auto;max-width:min(360px,calc(100vw - 8px))}
table.grid td.ck input{width:18px;height:18px;accent-color:var(--accent)}
table.grid td.saving{background:color-mix(in srgb,var(--blue) 10%,transparent)}

table.grid tr.is-hidden td{opacity:.55}
table.grid tr.past td input:not([type=checkbox]){color:var(--muted)}
.comp-head{padding:8px 16px;background:var(--blue-bg);color:var(--blue);font-weight:600;font-size:13px;letter-spacing:.03em;border-top:1px solid var(--line)}
.date{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:14px}

.match{min-width:0}

.meta{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.slot{display:flex;flex-direction:column;gap:4px;min-width:0}
.slot .nm{font-weight:600;font-size:14px;display:flex;gap:6px;align-items:center;overflow-wrap:anywhere}
.slot .nm .dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--line)}
.slot .nm .dot.on{background:var(--good)}
.slot .ln{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.role{display:inline-flex;align-items:center;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.role.op{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fee{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13px}

.pay.no{background:var(--warn-bg);color:var(--warn)}
button.pay:hover{border-color:currentColor}
.venue a.vct{font-size:12.5px;font-weight:600;color:var(--blue);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:2px 9px;margin-left:6px;white-space:nowrap}
.empty-slot{color:var(--muted);font-size:13px;font-style:italic}
.more{border:0;background:none;width:34px;height:34px;border-radius:8px;color:var(--muted);font-size:18px}

.vis{display:inline-flex;align-items:center;gap:4px;margin-top:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 9px;font:600 12px var(--f-body);color:var(--good);cursor:pointer;white-space:nowrap}

.vis.off{color:var(--muted);border-style:dashed}
.vis:hover{border-color:currentColor}
.row.is-hidden>.c-match,.row.is-hidden>.slot{opacity:.5}
.bulk{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--muted);margin-top:12px}
.bulk .confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
@media (max-width:820px){
  .row.head{display:none}
  .row{grid-template-columns:minmax(0,1fr) auto;row-gap:10px}
  .row>.c-date{grid-column:1/2}.row>.c-edit{grid-column:2/3;grid-row:1}
  .row>.c-match,.row>.slot{grid-column:1/-1}
}
.empty{padding:40px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px}

.empty strong{color:var(--ink);font-size:16px}
.note{font-size:13px;color:var(--muted)}
.err{font-size:13px;color:var(--bad)}

/* people */
.people{display:grid;gap:18px;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}

.prow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid var(--line);flex-wrap:wrap}

.ulink{display:flex;gap:6px;align-items:center;flex-wrap:wrap}

.scroll{max-height:420px;overflow:auto}

#notifyForm textarea{width:100%;font:inherit;font-size:14px;resize:vertical}

.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;border-left:5px solid var(--blue)}
.card.op{border-left-color:var(--accent)}

.vtag{display:inline-block;font:700 10.5px var(--f-body);letter-spacing:.06em;border:1px solid currentColor;border-radius:4px;padding:0 4px;margin-right:4px;vertical-align:1px}
.card .tfull{font-family:var(--f-mono)}
.match .tfull{font-size:12.5px}
.card .vfull{font-size:13px;color:var(--muted);margin-top:-4px}
details.map summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--blue);list-style:none;display:inline-flex;gap:4px;align-items:center}

.vrow{align-items:flex-start}
.mergebox{flex:1 1 100%;border:1px dashed var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:13.5px}

/* dialogs */
dialog{border:0;padding:0;border-radius:14px;background:var(--surface);color:var(--ink);width:min(600px,calc(100vw - 32px));max-height:calc(100dvh - 40px)}

.box{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}

/* ---------- weekly unavailability (κωλύματα) ---------- */

<!-- backend: Firebase sign-in + Firestore (see README) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
/* Firebase backend for GitHub Pages.
   Provides the same claude.use("db" | "user" | "downloads") interface the app was written against,
   backed by Firebase Authentication (email/password or Google) and Cloud Firestore.
   Also: the sign-in / sign-up screen and the "install on phone" button.
   Admins: users/<email> with role "admin" (or admins/<uid>) — see README and firestore.rules. */
(function(){
  const cfg = window.FIREBASE_CONFIG || {};
  const configured = !!(cfg.apiKey && cfg.projectId && window.firebase);
  let fs = null, auth = null;

  const css = `
  #cm-auth{--ink:#14213a;--muted:#5d6b84;--line:#d9dfea;--surface:#fff;--accent:#f0821e;--blue:#2a7fd4;--bad:#c43a2c;--good:#1d8a52;
    box-sizing:border-box;width:min(420px,100% - 32px);margin:48px auto 90px;padding:26px 22px 22px;font:15px "Commissioner",system-ui,sans-serif;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:16px}
  #cm-auth *{box-sizing:border-box}
  body.cm-signin{background:radial-gradient(120% 70% at 50% 0%,#24375e 0%,#14213a 55%,#0b1222 100%) fixed!important;min-height:100vh}
  body.cm-signin header,body.cm-signin .top-bar{display:none!important}
  #cm-hero{text-align:center;color:#fff;margin:44px auto 0;padding:0 16px;font-family:"Commissioner",system-ui,sans-serif}
  #cm-hero img{width:92px;height:92px;border-radius:22px;filter:drop-shadow(0 8px 22px rgba(0,0,0,.35))}
  #cm-hero h1{font:800 40px/1 "Fira Sans Extra Condensed",system-ui,sans-serif;margin:14px 0 0;text-transform:uppercase;letter-spacing:.02em;color:#fff}
  #cm-hero h1 span{color:#f0821e}
  #cm-hero .sub{color:#b9c6dd;font-size:14px;margin-top:6px;letter-spacing:.04em}
  #cm-hero .tag{display:inline-block;margin-top:10px;padding:4px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.22);color:#fff;font:700 11px "Commissioner",system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase}
  body.cm-signin #cm-auth{margin-top:22px;box-shadow:0 18px 50px rgba(0,0,0,.35);border-color:transparent}
  body.cm-signin #cm-credit{color:#b9c6dd}
  #cm-auth .brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  #cm-auth .brand img{width:48px;height:48px}
  #cm-auth h1{font:800 30px/1 "Fira Sans Extra Condensed",system-ui,sans-serif;margin:0;text-transform:uppercase;letter-spacing:.01em}
  #cm-auth h1 span{color:var(--accent)}
  #cm-auth .sub{color:var(--muted);font-size:13px;margin-top:3px}
  #cm-auth .tabs{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:16px}
  #cm-auth .tabs button{border:0;background:none;padding:10px;font:600 14px "Commissioner",system-ui,sans-serif;color:var(--muted);cursor:pointer}
  #cm-auth .tabs button[aria-selected="true"]{background:var(--ink);color:#fff}
  #cm-auth form{display:flex;flex-direction:column;gap:12px}
  #cm-auth label{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  #cm-auth input{font:16px "Commissioner",system-ui,sans-serif;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);width:100%;text-transform:none;letter-spacing:0}
  #cm-auth input:focus{outline:2px solid var(--blue);outline-offset:1px;border-color:transparent}
  #cm-auth .primary{font:600 16px "Commissioner",system-ui,sans-serif;padding:12px 18px;border-radius:10px;border:0;background:var(--accent);color:#fff;cursor:pointer;margin-top:4px}
  #cm-auth .primary:disabled{opacity:.6;cursor:default}
  #cm-auth .link{border:0;background:none;color:var(--blue);font:500 14px "Commissioner",system-ui,sans-serif;cursor:pointer;padding:4px 0;align-self:flex-start}
  #cm-auth .or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;margin:16px 0}
  #cm-auth .or::before,#cm-auth .or::after{content:"";flex:1;height:1px;background:var(--line)}
  #cm-auth .google{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;font:600 15px "Commissioner",system-ui,sans-serif;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
  #cm-auth .help{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px;padding:11px;border-radius:10px;border:1px dashed var(--line);color:var(--blue);font:600 15px "Commissioner",system-ui,sans-serif;text-decoration:none}
  #cm-auth .help:hover{border-style:solid;border-color:var(--blue)}
  #cm-auth .msg{font-size:14px;line-height:1.45;border-radius:8px;padding:9px 11px}
  #cm-auth .msg.err{color:var(--bad);background:#fbe9e7}
  #cm-auth .msg.ok{color:var(--good);background:#e3f4ea}
  #cm-auth .hint{color:var(--muted);font-size:13px;line-height:1.45;margin:0}
  #cm-auth p.lead{color:var(--muted);margin:0 0 14px;line-height:1.5}
  #cm-dock{position:static;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin:28px auto 4px;padding:0 16px}
  #cm-dock button{font:600 12px "Commissioner",system-ui,sans-serif;padding:7px 11px;border-radius:999px;border:1px solid #d9dfea;background:#fff;color:#14213a;cursor:pointer;box-shadow:0 1px 4px rgba(20,33,58,.12)}
  #cm-dock button.install{background:#f0821e;color:#fff;border-color:#f0821e}
  #cm-dock button[hidden]{display:none}
  #cm-ios{position:fixed;left:12px;right:12px;bottom:calc(60px + env(safe-area-inset-bottom,0px));z-index:51;max-width:420px;margin:0 auto;background:#14213a;color:#fff;border-radius:14px;padding:14px 16px;font:14px/1.5 "Commissioner",system-ui,sans-serif;box-shadow:0 6px 24px rgba(0,0,0,.25)}
  #cm-ios[hidden]{display:none}
  #cm-ios b{color:#f0821e}
  #cm-ios button{float:right;border:0;background:none;color:#fff;font-size:20px;line-height:1;cursor:pointer;margin:-4px -6px 0 8px}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) #cm-auth{--ink:#eef2f8;--muted:#a9b4c8;--line:#33405a;--surface:#1b2436}
    :root:not([data-theme="light"]) #cm-auth .tabs button[aria-selected="true"]{background:#eef2f8;color:#14213a}
    :root:not([data-theme="light"]) #cm-auth .msg.err{background:#3a1f1f}
    :root:not([data-theme="light"]) #cm-auth .msg.ok{background:#16301f}
    :root:not([data-theme="light"]) #cm-dock button:not(.install){background:#1b2436;color:#eef2f8;border-color:#33405a}
  }`;
  const st = document.createElement("style"); st.textContent = css + `
  .ic{width:1.15em;height:1.15em;flex:none;vertical-align:-.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}`; document.head.appendChild(st);
  /* one set of line icons for Check Mate and Ημερολόγιο (instead of emoji, which look different on every phone) */
  const ICONS = {dl:'<path d="M12 3v12M7 10l5 5 5-5M5 21h14"/>',ul:'<path d="M12 21V9M7 14l5-5 5 5M5 3h14"/>',cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',pin:'<path d="M12 21s-7-6.1-7-11a7 7 0 0 1 14 0c0 4.9-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',warn:'<path d="M12 3.5 22 20.5H2z"/><path d="M12 10v4.5M12 17.6v.1"/>',video:'<rect x="3" y="7" width="13" height="10" rx="2"/><path d="M16 11l5-3v8l-5-3"/>',save:'<path d="M5 3h11l3 3v15H5z"/><path d="M8 3v5h7V3M8 21v-7h8v7"/>',map:'<path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/>',mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',book:'<path d="M12 6c-2-1.5-5-2-8-2v15c3 0 6 .5 8 2 2-1.5 5-2 8-2V4c-3 0-6 .5-8 2z"/><path d="M12 6v15"/>',doc:'<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/>',print:'<path d="M7 9V3h10v6"/><path d="M7 17H4v-7h16v7h-3"/><path d="M7 14h10v7H7z"/>',lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',pen:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',phone:'<rect x="6" y="2" width="12" height="20" rx="2"/><path d="M11 18h2"/>',eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>'};
  window.cmIcon = n => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]||""}</svg>`;

  const esc = s => String(s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  /* the same code serves two apps: the main Check Mate app and the personal diary (imerologio.html) */
  const DIARY = window.CM_APP === "diary";
  function rootEl(){ return document.getElementById("root") || document.body; }

  /* ---------- install on phone / computer ---------- */
  const isStandalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  let deferredPrompt = null;
  if("serviceWorker" in navigator){ addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{})); }
  addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferredPrompt = e; updateDock(); });
  addEventListener("appinstalled", () => { deferredPrompt = null; updateDock(); });

  function dock(){
    let d = document.getElementById("cm-dock");
    if(!d){
      d = document.createElement("div"); d.id = "cm-dock";
      d.innerHTML = `<button type="button" class="install" id="cm-install" hidden><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M11 18h2"/></svg> Εγκατάσταση</button><button type="button" id="cm-signout" hidden>Αποσύνδεση</button>`;
      document.body.appendChild(d);
      const tip = document.createElement("div"); tip.id = "cm-ios"; tip.hidden = true; tip.setAttribute("role","dialog");
      tip.innerHTML = `<button type="button" aria-label="Κλείσιμο" id="cm-ios-x">×</button><b>Εγκατάσταση στο iPhone</b><br>1. Πάτησε το κουμπί <b>Κοινοποίηση</b> (το τετράγωνο με το βέλος ↑) στο Safari.<br>2. Επίλεξε <b>Προσθήκη στην οικία</b>.<br>3. Πάτησε <b>Προσθήκη</b>.`;
      document.body.appendChild(tip);
      document.getElementById("cm-ios-x").onclick = () => { tip.hidden = true; };
      document.getElementById("cm-install").onclick = async () => {
        if(deferredPrompt){ deferredPrompt.prompt(); try{ await deferredPrompt.userChoice; }catch{} deferredPrompt = null; updateDock(); }
        else if(isIOS()) tip.hidden = !tip.hidden;
      };
      document.getElementById("cm-signout").onclick = async () => { await auth.signOut(); location.reload(); };
    }
    return d;
  }
  function updateDock(){
    const d = dock();
    d.querySelector("#cm-install").hidden = isStandalone() || !(deferredPrompt || isIOS());
    d.querySelector("#cm-signout").hidden = !(auth && auth.currentUser);
    /* sit in the same bottom row as «Σχετικά» (from /suite-back.js) when it is there */
    const credit = document.getElementById("cm-credit");
    if(credit && d.parentNode !== credit){ credit.appendChild(d); d.style.margin = "0"; d.style.padding = "0"; }
  }
  addEventListener("load", () => setTimeout(updateDock, 700));
  if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", updateDock); else updateDock();

  /* ---------- sign-in / sign-up screen ---------- */
  const ERR = {
    "auth/invalid-email":"Το email δεν είναι σωστό.",
    "auth/missing-password":"Γράψε τον κωδικό σου.",
    "auth/invalid-credential":"Λάθος email ή κωδικός.",
    "auth/invalid-login-credentials":"Λάθος email ή κωδικός.",
    "auth/wrong-password":"Λάθος email ή κωδικός.",
    "auth/user-not-found":"Λάθος email ή κωδικός.",
    "auth/user-disabled":"Ο λογαριασμός έχει απενεργοποιηθεί. Μίλησε με τον διαχειριστή.",
    "auth/email-already-in-use":"Υπάρχει ήδη λογαριασμός με αυτό το email. Κάνε είσοδο, ή «Ξέχασα τον κωδικό».",
    "auth/weak-password":"Ο κωδικός θέλει τουλάχιστον 6 χαρακτήρες.",
    "auth/too-many-requests":"Πολλές προσπάθειες. Περίμενε λίγο και δοκίμασε ξανά.",
    "auth/network-request-failed":"Δεν υπάρχει σύνδεση στο διαδίκτυο.",
    "auth/operation-not-allowed":"Η είσοδος με email δεν είναι ενεργή ακόμα. Μίλησε με τον διαχειριστή.",
    "auth/account-exists-with-different-credential":"Αυτό το email χρησιμοποιεί άλλο τρόπο εισόδου. Δοκίμασε «Συνέχεια με Google»."
  };
  const errText = e => ERR[e && e.code] || "Κάτι πήγε στραβά. Δοκίμασε ξανά.";
  const googleSvg = `<svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.3 0-9.7-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>`;
  let pendingSignup = null;

  function showSetup(){
    rootEl().innerHTML = `<div id="cm-auth"><h1>Check <span>Mate</span></h1><p class="lead" style="margin-top:12px">Η εφαρμογή δεν έχει ρυθμιστεί ακόμα. Συμπλήρωσε τα στοιχεία Firebase στο αρχείο <code>firebase-config.js</code>.</p></div>`;
  }
  function showAuth(view="login", msg=null, email=""){
    const head = DIARY
      ? `<div id="cm-hero"><img src="icons/diary-192.png" alt=""><h1>Check <span>Mate</span></h1><div class="tag">Ημερολόγιο</div><div class="sub">Το προσωπικό αρχείο αγώνων σου</div></div>`
      : `<div id="cm-hero"><img src="icons/icon-192.png" alt=""><h1>Check <span>Mate</span></h1><div class="tag">Video Check</div><div class="sub">Αγώνες &amp; αναθέσεις</div></div>`;
    document.body.classList.add("cm-signin");
    const note = msg ? `<div class="msg ${msg.ok?"ok":"err"}" role="${msg.ok?"status":"alert"}">${esc(msg.text)}</div>` : "";
    let body;
    if(view==="reset"){
      body = `<p class="lead">Γράψε το email σου και θα σου στείλουμε σύνδεσμο για νέο κωδικό.</p>
      <form id="cm-f" novalidate>
        <label>Email<input id="cm-email" type="email" autocomplete="email" inputmode="email" required value="${esc(email)}"></label>
        ${note}
        <button class="primary" type="submit">Αποστολή συνδέσμου</button>
        <button class="link" type="button" data-view="login">← Πίσω στην είσοδο</button>
      </form>`;
    } else {
      const reg = view==="register";
      body = `<div class="tabs" role="tablist">
        <button type="button" role="tab" aria-selected="${!reg}" data-view="login">Είσοδος</button>
        <button type="button" role="tab" aria-selected="${reg}" data-view="register">Εγγραφή</button></div>
      <form id="cm-f" novalidate>
        ${reg?`<label>Ονοματεπώνυμο<input id="cm-name" autocomplete="name" required placeholder="π.χ. Γιάννης Παπαδόπουλος"></label>`:""}
        <label>Email<input id="cm-email" type="email" autocomplete="email" inputmode="email" required value="${esc(email)}"></label>
        <label>Κωδικός<input id="cm-pass" type="password" autocomplete="${reg?"new-password":"current-password"}" required minlength="6"></label>
        ${reg?`<label>Επανάληψη κωδικού<input id="cm-pass2" type="password" autocomplete="new-password" required minlength="6"></label><p class="hint">Τουλάχιστον 6 χαρακτήρες.</p>`:""}
        ${note}
        <button class="primary" type="submit">${reg?"Δημιουργία λογαριασμού":"Είσοδος"}</button>
        ${reg?"":`<button class="link" type="button" data-view="reset">Ξέχασα τον κωδικό</button>`}
      </form>
      <div class="or">ή</div>
      <button type="button" class="google" id="cm-google">${googleSvg} Συνέχεια με Google</button>`;
    }
    const help = `<a class="help" href="${DIARY ? "help/imerologio.html" : "help/"}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6c-2-1.5-5-2-8-2v15c3 0 6 .5 8 2 2-1.5 5-2 8-2V4c-3 0-6 .5-8 2z"/><path d="M12 6v15"/></svg> Οδηγίες χρήσης</a>`;
    rootEl().innerHTML = `${head}<div id="cm-auth">${body}${help}</div>`;
    const box = document.getElementById("cm-auth");
    box.querySelectorAll("[data-view]").forEach(b => b.onclick = () => showAuth(b.dataset.view, null, (document.getElementById("cm-email")||{}).value||email));
    const g = document.getElementById("cm-google"); if(g) g.onclick = google;
    const f = document.getElementById("cm-f");
    f.onsubmit = async e => {
      e.preventDefault();
      const val = id => (document.getElementById(id)||{}).value || "";
      const em = val("cm-email").trim();
      const btn = f.querySelector(".primary"); btn.disabled = true;
      try{
        if(view==="reset"){
          if(!em) throw {code:"auth/invalid-email"};
          await auth.sendPasswordResetEmail(em);
          showAuth("login", {ok:true, text:"Αν υπάρχει λογαριασμός με αυτό το email, θα λάβεις σύνδεσμο για νέο κωδικό. Κοίτα και στα ανεπιθύμητα."}, em);
          return;
        }
        if(view==="register"){
          const name = val("cm-name").trim(), p1 = val("cm-pass"), p2 = val("cm-pass2");
          if(!name){ showAuth("register", {text:"Γράψε το ονοματεπώνυμό σου."}, em); return; }
          if(p1 !== p2){ showAuth("register", {text:"Οι δύο κωδικοί δεν είναι ίδιοι."}, em); return; }
          let finish; pendingSignup = new Promise(r => finish = r);
          try{
            const cred = await auth.createUserWithEmailAndPassword(em, p1);
            try{ await cred.user.updateProfile({displayName:name}); }catch{}
          } finally { finish(); pendingSignup = null; }
          return;
        }
        await auth.signInWithEmailAndPassword(em, val("cm-pass"));
      }catch(err){
        showAuth(view, {text:errText(err)}, em);
      }
    };
    updateDock();
  }
  async function google(){
    const provider = new firebase.auth.GoogleAuthProvider();
    try{ await auth.signInWithPopup(provider); }
    catch(e){
      if(e && (e.code==="auth/popup-blocked" || e.code==="auth/operation-not-supported-in-this-environment")){
        try{ await auth.signInWithRedirect(provider); return; }catch(e2){ e = e2; }
      }
      if(e && e.code!=="auth/popup-closed-by-user" && e.code!=="auth/cancelled-popup-request") showAuth("login", {text:errText(e)});
    }
  }

  /* resolves with the signed-in Firebase user (waits on the sign-in screen until then) */
  const ready = new Promise(resolve => {
    if(!configured){ document.addEventListener("DOMContentLoaded", showSetup); if(document.readyState!=="loading") showSetup(); return; }
    firebase.initializeApp(cfg);
    auth = firebase.auth(); fs = firebase.firestore();
    auth.languageCode = "el";   // password-reset emails in Greek
    let done = false;
    auth.onAuthStateChanged(async u => {
      if(!u){ if(done) location.reload(); else showAuth(); return; }
      if(done) return;
      if(pendingSignup) await pendingSignup;   // wait for the name to be saved on sign-up
      done = true;
      document.body.classList.remove("cm-signin"); if(document.getElementById("cm-auth")) rootEl().innerHTML = `<div id="boot">Φόρτωση…</div>`;
      const joined = Date.parse(u.metadata && u.metadata.creationTime) || Date.now();
      const via = (u.providerData||[]).map(p=>p.providerId==="google.com"?"google":"email")[0] || "email";
      /* the diary is not linked to Check Mate: it never writes a profile, so using it does not register you there */
      if(!DIARY) try{ await fs.doc(`profiles/${u.uid}`).set({name:u.displayName||"", email:u.email||"", joinedAt:joined, via, seenAt:Date.now()}, {merge:true}); }catch{}
      updateDock();
      resolve(u);
    });
  });

  let adminP = null;
  const isAdmin = () => adminP || (adminP = ready.then(async u => {
    try{ const s = await fs.doc(`admins/${u.uid}`).get(); if(s.exists) return true; }catch{}
    try{ if(u.email && u.emailVerified){ const s = await fs.doc(`users/${u.email.toLowerCase()}`).get(); if(s.exists && s.data().role === "admin") return true; } }catch{}
    return false;
  }));

  const userApi = {
    canEdit: () => isAdmin(),
    idToken: async () => (await ready).getIdToken(),
    can: async () => true,
    me: async () => { const u = await ready; return {id:u.uid, name:u.displayName||"", email:u.email||""}; },
    profiles: async (ids) => {
      await ready; const out = {};
      await Promise.all(ids.map(async id => { try{ const s = await fs.doc(`profiles/${id}`).get(); if(s.exists) out[id] = {id, ...s.data()}; }catch{} }));
      return out;
    }
  };

  const downloadsApi = {
    save: async ({filename, data, mimeType}) => {
      const blob = data instanceof Blob ? data : new Blob([data], {type: mimeType || (/\.csv$/i.test(filename) ? "text/csv;charset=utf-8" : "application/octet-stream")});
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = filename || "download";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    }
  };

  /* email via the admin's Google Apps Script web app (URL in config/notify.endpoint).
     The script checks the Firebase ID token and that the caller is an admin before sending.
     Exception: {kind:"cant"} from any signed-in user, which the script sends only to the admin address in config/notify. */
  const mailApi = {
    send: async (endpoint, messages, opts = {}) => {
      const u = await ready;
      const idToken = await u.getIdToken();
      const res = await fetch(endpoint, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify({...(opts.extra||{}), idToken, messages, senderName:opts.senderName, replyTo:opts.replyTo})});
      let j = null; try{ j = await res.json(); }catch{}
      if(!j || !j.ok) throw new Error((j && j.error) || ("HTTP " + res.status));
      return j;
    }
  };

  window.claude = {
    use: async (name) => {
      if(!configured) return new Promise(() => {}); // stays on the setup message
      await ready;
      if(name === "db") return fs;
      if(name === "user") return userApi;
      if(name === "downloads") return downloadsApi;
      if(name === "mail") return mailApi;
      return null;
    }
  };
})();

</script>

<script>
/* Check Mate – schedule parser. rows = array of arrays (sheet_to_json header:1, raw:true) */
(function(root){
  const pad = n => String(n).padStart(2,"0");
  /* fold accents, case, dots and Latin look-alikes so "NOVIΒET" == "NOVIBET", "Ι." == "I" */
  const LAT = {A:"Α",B:"Β",E:"Ε",Z:"Ζ",H:"Η",I:"Ι",K:"Κ",M:"Μ",N:"Ν",O:"Ο",P:"Ρ",T:"Τ",Y:"Υ",X:"Χ"};
  const norm = s => String(s??"").normalize("NFD").replace(/[̀-ͯ]/g,"").toUpperCase()
    .replace(/[ABEZHIKMNOPTYX]/g,c=>LAT[c]).replace(/[.'΄’]/g,"").replace(/\s+/g," ").trim();
  const cell = v => String(v??"").replace(/\s+/g," ").trim();
  const ymd = (y,m,d) => `${y}-${pad(m)}-${pad(d)}`;

  function parseDate(v){
    if(v==null||v==="") return "";
    if(typeof v==="number"){ if(v<20000||v>80000) return ""; const d=new Date(Math.round((v-25569)*864e5)); return ymd(d.getUTCFullYear(),d.getUTCMonth()+1,d.getUTCDate()); }
    if(v instanceof Date && !isNaN(v)) return ymd(v.getFullYear(),v.getMonth()+1,v.getDate());
    const m = String(v).trim().match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{2,4})$/);
    if(!m) return "";
    let y=+m[3]; if(y<100) y+=2000; const d=+m[1], mo=+m[2];
    return mo>=1&&mo<=12&&d>=1&&d<=31 ? ymd(y,mo,d) : "";
  }
  /* "17-18-19/10" or "17,18/10" → {day:17, month:10} (year filled in from the season) */
  function parseRange(v){
    const m = String(v??"").trim().match(/^(\d{1,2})(?:\s*[-,&]\s*\d{1,2})+\s*[\/.]\s*(\d{1,2})(?:[\/.](\d{2,4}))?$/);
    if(!m) return null; let y=m[3]?+m[3]:0; if(y&&y<100) y+=2000;
    return {day:+m[1], month:+m[2], year:y};
  }
  function parseTime(v){
    if(v==null||v==="") return "";
    if(typeof v==="number"){
      if(v>0 && v<1){ const mins=Math.round(v*1440); return `${pad(Math.floor(mins/60)%24)}:${pad(mins%60)}`; }
      const h=Math.floor(v); let mi=Math.round((v-h)*100); if(mi>=60) mi=0; return h<24?`${pad(h)}:${pad(mi)}`:"";
    }
    const m=String(v).trim().match(/^(\d{1,2})(?:[.:,](\d{1,2}))?$/);
    if(!m) return "";
    const h=+m[1], mi=m[2]?(m[2].length===1?+m[2]*10:+m[2]):0;
    return h<24&&mi<60?`${pad(h)}:${pad(mi)}`:"";
  }
  function splitTeams(s){
    s=cell(s); if(!s) return ["",""];
    let a=s.split(/\s+[-–—]\s+/); if(a.length<2) a=s.split(/\s*[-–—]\s*/);
    return [cell(a[0]), cell(a.slice(1).join(" - "))];
  }
  function splitPeople(s){
    s=cell(s); if(!s) return [];
    let a=s.split(/\s+[-–—]\s*|\s*[-–—]\s+|\s*\/\s*|\s*[,;&]\s*/).map(cell).filter(Boolean);
    if(a.length===1) a=a[0].split(/(?<=\.)\s*[-–—]\s*/).map(cell).filter(Boolean);
    /* "ΤΣΙΝΤΟΜΗΝΑΣ Μ. ΠΑΠΑΔΟΠΟΥΛΟΣ" (dash forgotten) → split after the initial */
    if(a.length===1) a=a[0].split(/(?<=\s\S{1,3}\.)\s+(?=\S{3,})/).map(cell).filter(Boolean);
    return a;
  }

  const HEAD = [["date",/ΗΜΕΡ|DATE/],["time",/^ΩΡΑ|TIME/],["venue",/ΓΗΠΕΔ|VENUE|ΧΩΡΟΣ/],["match",/ΑΓΩΝ|MATCH/],["tv",/ΚΑΛΥΨ|ΜΕΤΑΔ|TV|ΚΑΝΑΛ/],["vc",/VAR|^VC|ΣΕΤ|ΕΞΟΠΛ/],["people",/ΣΥΝΕΡΓ|ΑΤΟΜ|ΧΕΙΡΙΣΤ|ΠΡΟΣΩΠ/]];
  function findHeader(rows){
    for(let i=0;i<Math.min(rows.length,15);i++){
      const r=rows[i]||[]; const map={};
      r.forEach((v,c)=>{ const t=String(v??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase().trim(); if(!t) return; for(const [k,re] of HEAD){ if(map[k]==null && re.test(t)){ map[k]=c; break; } } });
      if(map.date!=null && map.match!=null) return {row:i, map};
    }
    return null;
  }

  function parseRows(rows){
    const hdr = findHeader(rows);
    const C = hdr ? hdr.map : null;
    const out=[], skipped=[]; let comp="", block=[];
    const flush = () => {
      /* rows without their own date take the round's date (marked as to-be-confirmed) */
      const first = block.find(r=>r.date)?.date || "";
      block.forEach(r=>{ if(!r.date && !r._range && first){ r.date=first; r.dateTbc=true; } if(!r.date && !r._range) skipped.push({line:r.line, reason:"Χωρίς ημερομηνία", raw:`${r.home} - ${r.away}`}); else out.push(r); });
      block=[];
    };
    rows.forEach((row,i)=>{
      if(!Array.isArray(row) || (hdr && i<=hdr.row)) return;
      let get, di;
      if(C){ get = k => C[k]==null ? "" : row[C[k]]; }
      else {
        di=row.findIndex(v=>parseDate(v)||parseRange(v)); if(di<0) di=0;
        const pos={date:0,time:1,venue:2,match:3,tv:4,vc:5,people:6}; get = k => row[di+pos[k]];
      }
      const vals = ["date","time","venue","match","tv","vc","people"].map(k=>cell(get(k)));
      if(!vals.some(Boolean)) return;
      const [dRaw,tRaw,venue,match,tv,vc,ppl] = vals;
      const date = parseDate(get("date")), range = date?null:parseRange(get("date"));
      const others = [dRaw,tRaw,venue,tv,vc,ppl].filter(Boolean).length;
      if(!others && match){ flush(); comp=match; return; }              /* competition / round title */
      if(!C && !date && !range && vals.filter(Boolean).length<=2){ flush(); comp=vals.filter(Boolean).join(" "); return; }
      if(!match){ return; }                                              /* date-only or placeholder row */
      const [home,away] = splitTeams(match);
      const people = splitPeople(get("people"));
      const time = parseTime(get("time"));
      const r = {line:i+1, comp, date, dateText: range?dRaw:"", time, timeText: time?"":tRaw, venue, home, away, tv, vc, op:people[0]||"", as:people[1]||"", extra:people.slice(2).join(", ")};
      if(range) r._range=range;
      block.push(r);
    });
    flush();
    /* season: infer year for "17-18-19/10" style ranges, and flag dates outside it */
    const years = out.filter(r=>!r._range).map(r=>+r.date.slice(0,4)+(+r.date.slice(5,7)>=7?0:-1));
    const cnt={}; years.forEach(y=>cnt[y]=(cnt[y]||0)+1);
    const season = +Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0]?.[0] || new Date().getFullYear();
    out.forEach(r=>{
      if(r._range){ const y=r._range.year||(r._range.month>=7?season:season+1); r.date=ymd(y,r._range.month,r._range.day); r.dateTbc=false; delete r._range; }
      const sy=+r.date.slice(0,4)+(+r.date.slice(5,7)>=7?0:-1);
      if(sy!==season) r.warn="Η ημερομηνία είναι εκτός σεζόν "+season+"-"+String(season+1).slice(2)+" – έλεγξέ τη";
    });
    /* "ΠΑΠΑΔΟΠΟΥΛΟΣ" alone → "ΠΑΠΑΔΟΠΟΥΛΟΣ Ι." when exactly one full name has that surname */
    const full = [...new Set(out.flatMap(r=>[r.op,r.as]).filter(n=>/\S+\s+\S/.test(n)))];
    out.forEach(r=>["op","as"].forEach(k=>{
      const n=r[k]; if(!n || /\s/.test(n)) return;
      const hits = full.filter(f=>norm(f).split(" ")[0]===norm(n));
      if(hits.length===1) r[k]=hits[0];
    }));
    return {rows:out, skipped, season};
  }
  root.CMParse = {parseRows, parseDate, parseTime, norm, splitPeople};
})(typeof window!=="undefined"?window:globalThis);

</script>
<script>
/* ===== MODE 1: personal match log (users record their own matches; admin marks payments and paid ones lock) ===== */
function runLog(){

(() => {
const $ = id => document.getElementById(id);
const ROLE = {op:"Χειριστής", as:"Βοηθός"};
const MONTHS_FULL = ["Ιανουάριος","Φεβρουάριος","Μάρτιος","Απρίλιος","Μάιος","Ιούνιος","Ιούλιος","Αύγουστος","Σεπτέμβριος","Οκτώβριος","Νοέμβριος","Δεκέμβριος"];
const DAYS = ["Κυρ","Δευ","Τρι","Τετ","Πεμ","Παρ","Σαβ"];
/* Unpaid matches live in "matches" (Contributors can write).
   Paid matches live in "paid" — only Editors/Owner (admin) can write there,
   so once the administrator marks a match paid, nobody else can change or delete it. */
let db = null, col = null, colPaid = null, openRows = [], paidRows = [], rows = [];
let FEES = {op:80, as:40};
let loadedOpen = false, loadedPaid = false, canWrite = true, isAdmin = false, editingId = null;
const st = {season:"", month:"", person:"", role:"", paid:"", q:""};

const ls = {get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch{return d}},
            set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const eur = n => (Math.round((+n||0)*100)/100).toLocaleString("el-GR",{minimumFractionDigits:0,maximumFractionDigits:2}) + " €";
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const seasonOf = d => { if(!d) return ""; const [y,m]=d.split("-").map(Number); return m>=7?`${y}-${String(y+1).slice(2)}`:`${y-1}-${String(y).slice(2)}`; };
const fmtDate = d => { if(!d) return ""; const [y,m,dd]=d.split("-"); return `${dd}/${m}/${y}`; };
const dayName = d => { if(!d) return ""; const x=new Date(d+"T12:00"); return DAYS[x.getDay()]; };
const today = () => { const t=new Date(); return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`; };
const loaded = () => loadedOpen && loadedPaid;
const locked = r => !!r?.paid && !isAdmin;

function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }

function merge(){
  const paidIds = new Set(paidRows.map(r=>r.id));
  rows = [...paidRows.map(r=>({...r, paid:true})), ...openRows.filter(r=>!paidIds.has(r.id)).map(r=>({...r, paid:false}))]
    .sort((a,b)=>(b.date||"").localeCompare(a.date||"") || (b.time||"").localeCompare(a.time||""));
}

/* move/save a match into the collection matching its paid state */
async function saveMatch(id, data, wasPaid){
  const target = data.paid ? colPaid : col;
  if(!id){ await target.add(data); return; }
  await target.doc(id).set(data);
  if(wasPaid !== undefined && wasPaid !== data.paid){
    await (wasPaid ? colPaid : col).doc(id).delete();
  }
}

/* ---------- filters ---------- */
function filtered(){
  const q = st.q.trim().toLowerCase();
  return rows.filter(r =>
    (!st.season || seasonOf(r.date)===st.season) &&
    (!st.month || (r.date||"").slice(0,7)===st.month) &&
    (!st.person || r.person===st.person) &&
    (!st.role || r.role===st.role) &&
    (!st.paid || (st.paid==="yes") === !!r.paid) &&
    (!q || [r.home,r.away,r.comp,r.venue,r.notes,r.person].join(" ").toLowerCase().includes(q))
  );
}
function fillSelect(sel, opts, allLabel, cur){
  sel.innerHTML = `<option value="">${allLabel}</option>` + opts.map(([v,l])=>`<option value="${esc(v)}"${v===cur?" selected":""}>${esc(l)}</option>`).join("");
}
function uniq(a){ return [...new Set(a.filter(Boolean))].sort((x,y)=>x.localeCompare(y,"el")); }
function refreshOptions(){
  const seasons = uniq(rows.map(r=>seasonOf(r.date))).reverse();
  if(st.season && !seasons.includes(st.season)) st.season="";
  fillSelect($("fSeason"), seasons.map(s=>[s,s]), "Όλες", st.season);
  const months = uniq(rows.filter(r=>!st.season||seasonOf(r.date)===st.season).map(r=>(r.date||"").slice(0,7))).reverse();
  if(st.month && !months.includes(st.month)) st.month="";
  fillSelect($("fMonth"), months.map(m=>[m, MONTHS_FULL[+m.slice(5)-1]+" "+m.slice(0,4)]), "Όλοι", st.month);
  const people = uniq(rows.map(r=>r.person));
  if(st.person && !people.includes(st.person)) st.person="";
  fillSelect($("fPerson"), people.map(p=>[p,p]), "Όλοι", st.person);
  const dl = (id, arr) => $(id).innerHTML = uniq(arr).map(v=>`<option value="${esc(v)}">`).join("");
  dl("dlTeams", rows.flatMap(r=>[r.home,r.away])); dl("dlComps", rows.map(r=>r.comp));
  dl("dlVenues", rows.map(r=>r.venue)); dl("dlPeople", rows.map(r=>r.person));
}

/* ---------- render ---------- */
function render(){
  refreshOptions();
  const list = filtered();
  const total = list.reduce((s,r)=>s+(+r.fee||0),0);
  const paid = list.filter(r=>r.paid).reduce((s,r)=>s+(+r.fee||0),0);
  $("sMatches").textContent = list.length;
  $("sRoles").textContent = `${list.filter(r=>r.role==="op").length} / ${list.filter(r=>r.role==="as").length}`;
  $("sTotal").textContent = eur(total); $("sPaid").textContent = eur(paid); $("sDue").textContent = eur(total-paid);

  const log = $("log");
  if(!loaded()){ return; }
  if(!rows.length){
    log.innerHTML = `<div class="empty"><div class="board-art"></div><strong>Δεν έχει καταγραφεί αγώνας ακόμα</strong>
      <div>Πάτησε «Νέος αγώνας» για να καταχωρίσεις τον πρώτο: ημερομηνία, ομάδες, θέση και αμοιβή.</div>
      ${canWrite?`<button class="btn primary" type="button" data-act="add">+ Νέος αγώνας</button>`:""}</div>`;
    return;
  }
  if(!list.length){ log.innerHTML = `<div class="empty"><strong>Κανένας αγώνας με αυτά τα φίλτρα</strong><button class="btn" type="button" data-act="clear">Καθαρισμός φίλτρων</button></div>`; return; }
  const payTitle = isAdmin ? "Αλλαγή κατάστασης πληρωμής" : "Μόνο ο διαχειριστής αλλάζει την πληρωμή";
  log.innerHTML = `<div class="row head"><div>Ημ/νία</div><div>Αγώνας</div><div>Θέση</div><div style="text-align:right">Αμοιβή</div><div>Πληρωμή</div><div></div></div>` +
   list.map(r=>{
     const lk = locked(r);
     return `<div class="row">
     <div class="date c-date">${fmtDate(r.date)}<small>${dayName(r.date)}${r.time?" · "+esc(r.time):""}</small></div>
     <div class="match c-match"><b>${esc(r.home)} – ${esc(r.away)}</b><div class="meta">${[r.comp,r.venue].filter(Boolean).map(esc).join(" · ")||"&nbsp;"}</div></div>
     <div><span class="role ${r.role==="op"?"op":""}">${ROLE[r.role]||"—"}</span><div class="who">${esc(r.person)}</div></div>
     <div class="fee">${eur(r.fee)}</div>
     <div><button class="pay ${r.paid?"yes":"no"}" type="button" data-act="toggle" data-id="${r.id}" ${isAdmin?"":"disabled"} title="${payTitle}">${r.paid?`${lk?"🔒":"✓"} Πληρώθηκε${r.paidDate?` <small>${fmtDate(r.paidDate).slice(0,5)}</small>`:""}`:"● Εκκρεμεί"}</button></div>
     <div><button class="more" type="button" data-act="edit" data-id="${r.id}" aria-label="${lk?"Κλειδωμένο – πληρώθηκε":"Επεξεργασία"}" title="${lk?"Πληρώθηκε – δεν αλλάζει":"Επεξεργασία"}" ${canWrite&&!lk?"":"disabled"}>${lk?"🔒":"✎"}</button></div>
   </div>`;}).join("");
}

/* ---------- form ---------- */
function openForm(r){
  if(locked(r)){ toast("Ο αγώνας πληρώθηκε και είναι κλειδωμένος"); return; }
  editingId = r?.id || null;
  $("frmTitle").textContent = r ? "Επεξεργασία αγώνα" : "Νέος αγώνας";
  const lastPerson = ls.get("cm.person","");
  $("iDate").value = r?.date || today(); $("iTime").value = r?.time || "";
  $("iHome").value = r?.home || ""; $("iAway").value = r?.away || "";
  $("iComp").value = r?.comp ?? ls.get("cm.comp",""); $("iVenue").value = r?.venue || "";
  $("iPerson").value = r?.person ?? lastPerson;
  const role = r?.role || ls.get("cm.role","op");
  $(role==="as"?"rAs":"rOp").checked = true;
  $("iFee").value = r ? (r.fee ?? FEES[role]) : FEES[role];
  $("iFee").readOnly = !isAdmin; $("feeHint").hidden = isAdmin;
  $("iPaid").checked = !!r?.paid; $("iPaidDate").value = r?.paidDate || "";
  $("iPaid").disabled = !isAdmin; $("iPaidDate").disabled = !isAdmin; $("paidHint").hidden = isAdmin;
  $("iNotes").value = r?.notes || "";
  $("frmErr").hidden = true; $("frmLock").hidden = true; $("frmFields").disabled = false; $("btnSave").hidden = false;
  $("delWrap").innerHTML = r ? `<button type="button" class="btn danger" data-act="askdel">Διαγραφή</button>` : "";
  $("dlg").showModal();
}
document.querySelectorAll('input[name="role"]').forEach(el=>el.addEventListener("change",()=>{
  if(editingId && isAdmin) return; $("iFee").value = FEES[el.value];
}));
$("iPaid").addEventListener("change",()=>{ if($("iPaid").checked && !$("iPaidDate").value) $("iPaidDate").value=today(); });
$("btnCancel").onclick = () => $("dlg").close();
$("delWrap").addEventListener("click", async e => {
  const a = e.target.closest("[data-act]")?.dataset.act;
  if(a==="askdel") $("delWrap").innerHTML = `<span class="confirm">Οριστικά; <button type="button" class="btn danger" data-act="del">Ναι, διαγραφή</button><button type="button" class="btn" data-act="nodel">Όχι</button></span>`;
  if(a==="nodel") $("delWrap").innerHTML = `<button type="button" class="btn danger" data-act="askdel">Διαγραφή</button>`;
  if(a==="del"){
    const r = rows.find(x=>x.id===editingId);
    if(locked(r)){ showErr({code:"locked"}); return; }
    try{ await (r?.paid ? colPaid : col).doc(editingId).delete(); $("dlg").close(); toast("Ο αγώνας διαγράφηκε"); }catch(err){ showErr(err); }
  }
});
function showErr(err){ $("frmErr").hidden=false; $("frmErr").textContent =
  err?.code==="locked" ? "Ο αγώνας πληρώθηκε και μόνο ο διαχειριστής μπορεί να τον αλλάξει." :
  err?.code==="invalid_argument" ? "Δεν έχεις δικαίωμα γι' αυτή την αλλαγή. Οι πληρωμένοι αγώνες αλλάζουν μόνο από τον διαχειριστή." :
  "Η αποθήκευση απέτυχε. Δοκίμασε ξανά σε λίγο."; }
$("frm").addEventListener("submit", async e => {
  e.preventDefault();
  const prevRow = editingId ? rows.find(r=>r.id===editingId) : null;
  if(locked(prevRow)){ showErr({code:"locked"}); return; }
  const role = document.querySelector('input[name="role"]:checked').value;
  const paidNow = isAdmin ? $("iPaid").checked : !!prevRow?.paid;
  const d = {

    comp:$("iComp").value.trim(), venue:$("iVenue").value.trim(), person:$("iPerson").value.trim(), role,

function toastLong(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; t.style.maxWidth="min(520px,calc(100vw - 32px))"; document.body.appendChild(t); setTimeout(()=>t.remove(),7000); }
async function w(fn){ for(let i=0;;i++){ try{ return await fn(); }catch(e){ if(i<5 && (e?.code==="resource_exhausted"||e?.code==="unavailable")){ await sleep(400*2**i); continue; } throw e; } } }

let db=null, user=null, me=null, isAdmin=false;

/* =================================================================
   DATA LAYOUT
   sched/{id}                 all assignments (supervisor only)
   roster/{rid} {name}        names from the schedule (readable by users, to claim theirs)
   links/{rid}  {uid}         name -> account (supervisor only)
   claims/{uid} {rid,status}  a user's "this is me" request (own doc)
   mine/{uid}/items/{id_role} what each user sees (written by supervisor, read by that user only)
   config/fees {op,as}
   ================================================================= */

(async () => {
  db = await claude.use("db");
  user = await claude.use("user");
  if(!db){ $("app").innerHTML = `<div class="panel"><div class="empty"><strong>Η σελίδα χρειάζεται σύνδεση</strong><div>Συνδέσου με τον λογαριασμό Google σου.</div></div></div>`; return; }
  isAdmin = user ? !!(await user.canEdit()) : false;
  me = user ? await user.me() : null;
  if(isAdmin && ls.get(AS_USER,false)){ isAdmin=false; roleSwitch(true); startUser(); }   // admin looking at the app as a user
  else if(isAdmin){ roleSwitch(false); startAdmin(); } else startUser();
})();

/* «Ως χρήστης»: an administrator can switch (on this device) to the user screen and see their own assignments
   exactly as the users see them; «↩ Διαχειριστής» switches back. */
const AS_USER = "cm.asUser";
function roleSwitch(asUser){
  const go = v => { ls.set(AS_USER, v); location.reload(); };
  if(asUser){
    const bar = document.createElement("div");
    bar.className = "banner asubar"; bar.setAttribute("role","status");
    bar.innerHTML = `<span aria-hidden="true">👤</span><span class="grow"><b>Προβολή χρήστη.</b> Βλέπεις την εφαρμογή όπως οι χρήστες, με τις δικές σου αναθέσεις.</span><button type="button" class="btn small primary">↩ Διαχειριστής</button>`;
    bar.querySelector("button").onclick = () => go(false);
    $("app").before(bar);
  } else {
    const b = document.createElement("button");
    b.className = "btn"; b.type = "button"; b.id = "btnAsUser"; b.title = "Δες την εφαρμογή όπως οι χρήστες, με τις δικές σου αναθέσεις";
    b.innerHTML = `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg><span class="hl"> Ως χρήστης</span>`;
    b.onclick = () => go(true);
    $("adminActions").prepend(b);
  }
}

let tab = ls.get("cm.tab","sched");
const st = {season:"", month:"", person:"", paid:"", vis:"", q:"", week:weekOf(today())};
/* programme view: «Κάρτες» or «Πίνακας» (spreadsheet). Phone starts in cards, computer in the table; a choice is remembered per device */
let view = (()=>{ try{ const v=localStorage.getItem("cm.view"); if(v==="cards"||v==="grid") return v; }catch{} return "grid"; })();
/* the switch and the table are for the computer only: on a phone the programme is always shown as cards */
const WIDE = matchMedia("(min-width:900px)");
const viewNow = () => WIDE.matches ? view : "cards";

function rosterByNorm(){ const m={}; roster.forEach(r=>m[norm(r.name)]=r); return m; }
function uidForName(name){ if(!name) return null; const r=rosterByNorm()[norm(name)]; return r ? (links[r.id]||null) : null; }
function unavOf(uid, wk){ return uid ? (profilesAll[uid]?.unavail||{})[wk] || null : null; }
function unavailOn(name, date){   // the person declared they cannot work that day
  if(!name || !date) return null; const e=unavOf(uidForName(name), weekOf(date));
  return e && (e.days||[]).includes(date) ? e : null;
}

function startAdmin(){
  $("adminActions").hidden = false;
  $("subtitle").textContent = "Video Check · πίνακας διαχειριστή";
  db.collection("sched").orderBy("date","asc").limit(2000).onSnapshot(s=>{ sched=s.docs.map(d=>({id:d.id,...d.data()})); ready.sched=true; renderAdmin(); checkPhones(); }, loadErr);
  db.collection("roster").limit(1000).onSnapshot(s=>{ roster=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.name.localeCompare(b.name,"el")); ready.roster=true; renderAdmin(); }, loadErr);
  db.collection("links").limit(1000).onSnapshot(s=>{ links={}; s.docs.forEach(d=>links[d.id]=d.data().uid); ready.links=true; renderAdmin(); }, loadErr);
  db.collection("claims").limit(1000).onSnapshot(s=>{ claims=s.docs.map(d=>({uid:d.id,...d.data()})); renderAdmin(); }, ()=>{});
  db.collection("profiles").limit(2000).onSnapshot(s=>{ profilesAll={}; s.docs.forEach(d=>profilesAll[d.id]=d.data()); ready.profiles=true; if(tab!=="lists") renderAdmin(); checkPhones(); }, ()=>{});
  db.collection("teams").limit(1000).onSnapshot(s=>{ teamList=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.name.localeCompare(b.name,"el")); listsReady.teams=true; dedupeLists(); seedLists(); upgradeItems(); if(tab==="lists") renderAdmin(); }, ()=>{});
  db.collection("venues").limit(1000).onSnapshot(s=>{ venues=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.name.localeCompare(b.name,"el")); listsReady.venues=true; dedupeLists(); seedLists(); upgradeItems(); if(tab==="lists") renderAdmin(); }, ()=>{});
  db.collection("contacts").limit(1000).onSnapshot(s=>{ contacts={}; s.docs.forEach(d=>contacts[d.id]=d.data().email||""); ready.contacts=true; if(tab==="people") renderAdmin(); }, ()=>{});
  db.doc("config/notify").onSnapshot(s=>{ notify={email:false, endpoint:"", ...(s.exists?s.data():{})}; if(tab==="people") renderAdmin(); }, ()=>{});
  claude.use("mail").then(x=>{ mail=x; if(Object.keys(outbox).length) outboxTimer = setTimeout(flushNotes, 4000); }).catch(()=>{});
  db.doc("config/fees").onSnapshot(s=>{ if(s.exists) fees={op:80,as:40,...s.data()}; }, ()=>{});
}
function loadErr(){ $("app").innerHTML = `<div class="panel"><div class="empty"><strong>Δεν φορτώθηκαν τα δεδομένα</strong><div>Ανανέωσε τη σελίδα.</div></div></div>`; }

function slotsOf(list){ const s=[]; list.forEach(m=>["op","as"].forEach(r=>{ if(m[r]) s.push({m, role:r, name:m[r], fee:+m["fee_"+r]||0, paid:!!m["paid_"+r]}); })); return s; }
function filteredSched(){
  const q=st.q.trim().toLowerCase(), pn=st.person?norm(st.person):"";
  const wkDays = st.week ? new Set(weekDays(st.week)) : null;
  return sched.filter(m =>
    (!wkDays || wkDays.has(m.date)) &&
    (wkDays || !st.season || seasonOf(m.date)===st.season) &&
    (wkDays || !st.month || (m.date||"").slice(0,7)===st.month) &&
    (!pn || norm(m.op)===pn || norm(m.as)===pn) &&
    (!st.paid || ["op","as"].some(r=>m[r] && (!pn||norm(m[r])===pn) && (st.paid==="yes")===!!m["paid_"+r])) &&
    (!st.vis || (st.vis==="hidden")===!!m.hidden) &&
    (!q || [m.home,m.away,m.comp,m.venue,m.op,m.as,m.tv,m.vc].join(" ").toLowerCase().includes(q))
  );
}

  if(!(ready.sched&&ready.roster&&ready.links)) return;
  seedLists();
  upgradeItems();
  const pending = claims.filter(c=>c.status==="pending");
  const seasons = uniq(sched.map(m=>seasonOf(m.date))).reverse();

  if(st.month && !months.includes(st.month)) st.month="";

  fill("dlTeams", teamNames()); fill("dlComps", sched.map(m=>m.comp)); fill("dlVenues", venueNames()); fill("dlTv", sched.map(m=>m.tv)); fill("dlPeople", people);

  const focus = document.activeElement?.id, ae = document.activeElement;
  const typed = ae && ae.dataset && ae.dataset.g && ae.type!=="checkbox" ? ae.value : null, gx = $("gwrap")?.scrollLeft || 0;
  let sel = null; try{ if(typed!==null && ae.type==="text") sel = [ae.selectionStart, ae.selectionEnd]; }catch{}
  $("app").innerHTML = `
  <div style="display:flex;flex-direction:column;gap:18px">
    ${backupDue() ? `<div class="banner" role="status">${cmIcon("save")}<span class="grow">${ls.get("cm.lastBackup",0) ? "Πέρασε πάνω από μία εβδομάδα από το τελευταίο αντίγραφο ασφαλείας." : "Κράτα ένα αντίγραφο ασφαλείας με όλο το πρόγραμμα και τις πληρωμές."}</span>
      <button class="btn small primary" type="button" data-act="backup">${cmIcon("dl")} Αντίγραφο σε Excel</button><button class="btn small" type="button" data-act="backuplater">Αργότερα</button></div>` : ""}
    ${(()=>{ const L=cantList(); return L.length ? `<div class="banner cantban" role="alert">✋<div class="grow"><b>${L.length===1?"Ένα άτομο δηλώνει":"Άτομα δηλώνουν"} ότι δεν μπορούν:</b><ul>${L.map(({m,r,c})=>`<li><span><b>${esc(m[r])}</b> (${ROLE[r]}) · ${esc(niceDate(m.date))} ${esc(m.time||"")} · ${esc(m.home)}${m.away?" – "+esc(m.away):""}${c.note?` · «${esc(c.note)}»`:""}</span>
        <span class="cantact"><button class="btn small" type="button" data-act="edit" data-id="${m.id}">✎ Αλλαγή</button><button class="btn small" type="button" data-act="cantack" data-id="${m.id}" data-role="${r}">✓ Το είδα</button></span></li>`).join("")}</ul></div></div>` : ""; })()}
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="sched" aria-selected="${tab==="sched"}">Πρόγραμμα</button>
      <button role="tab" data-tab="lists" aria-selected="${tab==="lists"}">Ομάδες & γήπεδα</button>
      <button role="tab" data-tab="people" aria-selected="${tab==="people"}">Άτομα${pending.length?`<span class="badge">${pending.length}</span>`:""}</button>
      <button role="tab" data-tab="unav" aria-selected="${tab==="unav"}">Κωλύματα</button>
      <button role="tab" data-tab="stats" aria-selected="${tab==="stats"}">Στατιστικά</button>
    </nav>
    <div id="tabBody"></div>
  </div>`;
  if(tab==="sched") renderSched(months, people, seasons); else if(tab==="lists") renderLists(); else if(tab==="unav") renderUnav(); else if(tab==="stats") renderStats(seasons); else renderPeople(pending);
  if($("gwrap")) $("gwrap").scrollLeft = gx;
  if(gd.id && !$(gd.id)) gdClose();
  if(focus && $(focus)){ const el=$(focus); if(typed!==null && el.value!==typed) el.value = typed; el.focus({preventScroll:true}); if(el.setSelectionRange && (el.type==="search"||el.type==="text")) try{ sel ? el.setSelectionRange(sel[0], sel[1]) : el.setSelectionRange(el.value.length, el.value.length); }catch{} if(gd.id===focus) gdOpen(el, typed!==null && typed!==(sched.find(x=>x.id===el.dataset.id)?.[el.dataset.g]??"") ? typed : ""); }

function renderSched(months, people, seasons=[]){
  const list = filteredSched();
  const pn = st.person?norm(st.person):"";
  const slots = slotsOf(list).filter(s=>!pn||norm(s.name)===pn);
  const total=slots.reduce((a,s)=>a+s.fee,0), paid=slots.filter(s=>s.paid).reduce((a,s)=>a+s.fee,0);
  const opt=(arr,cur,all)=>`<option value="">${all}</option>`+arr.map(([v,l])=>`<option value="${esc(v)}"${v===cur?" selected":""}>${esc(l)}</option>`).join("");
  let html = `
  <section class="board" aria-label="Σύνολα">
    <div class="cell"><div class="k">Αγώνες</div><div class="v">${list.length}</div></div>
    <div class="cell"><div class="k">Αναθέσεις</div><div class="v">${slots.length}</div></div>
    <div class="cell"><div class="k">Σύνολο αμοιβών</div><div class="v">${eur(total)}</div></div>
    <div class="cell"><div class="k">Πληρώθηκαν</div><div class="v">${eur(paid)}</div></div>
    <div class="cell"><div class="k">Εκκρεμούν</div><div class="v or">${eur(total-paid)}</div></div>
  </section>
  <section class="wkbar" aria-label="Αγωνιστική">
    ${st.week?`<button type="button" class="btn wkarrow" data-act="wk" data-d="-7" aria-label="Προηγούμενη εβδομάδα">◀</button>
      <div class="wkcur"><span class="k">Αγωνιστική εβδομάδα${st.week===weekOf(today())?" · τρέχουσα":""}</span><b>${weekLabel(st.week)}</b></div>
      <button type="button" class="btn wkarrow" data-act="wk" data-d="7" aria-label="Επόμενη εβδομάδα">▶</button>
      <span class="wkgap"></span>
      ${st.week!==weekOf(today())?`<button type="button" class="btn small" data-act="wknow">Τρέχουσα</button>`:""}
      <button type="button" class="btn small" data-act="wkall">Όλοι οι αγώνες</button>`
    :`<div class="wkcur"><span class="k">Προβολή</span><b>Όλοι οι αγώνες</b></div><span class="wkgap"></span>
      <button type="button" class="btn small primary" data-act="wknow">Ανά αγωνιστική εβδομάδα</button>`}
  </section>
  <section class="filters" aria-label="Φίλτρα" style="margin-top:12px">
    ${st.week?"":`<div class="f"><label for="fSeason">Σεζόν</label><select id="fSeason">${opt(seasons.map(x=>[x,x]),st.season,"Όλες")}</select></div>
    <div class="f"><label for="fMonth">Μήνας</label><select id="fMonth">${opt(months.slice().reverse().map(m=>[m,MONTHS_FULL[+m.slice(5)-1]+" "+m.slice(0,4)]),st.month,"Όλοι")}</select></div>`}
    <div class="f"><label for="fPerson">Άτομο</label><select id="fPerson">${opt(people.map(p=>[p,p]),st.person,"Όλα")}</select></div>
    <div class="f"><label for="fPaid">Πληρωμή</label><select id="fPaid">${opt([["no","Εκκρεμεί"],["yes","Πληρώθηκε"]],st.paid,"Όλα")}</select></div>
    <div class="f"><label for="fVis">Στους χρήστες</label><select id="fVis">${opt([["shown","Ορατές"],["hidden","Κρυφές"]],st.vis,"Όλες")}</select></div>
    <div class="f grow"><label for="fSearch">Αναζήτηση</label><input id="fSearch" type="search" value="${esc(st.q)}" placeholder="Ομάδα, γήπεδο, VC…"></div>
  </section>
  ${WIDE.matches?`<div class="viewsw" role="group" aria-label="Προβολή"><button type="button" data-act="view" data-v="cards" aria-pressed="${view==="cards"}">Κάρτες</button><button type="button" data-act="view" data-v="grid" aria-pressed="${view==="grid"}">Πίνακας</button>${view==="grid"?`<span class="vhint">Αλλάξτε ένα κελί και αποθηκεύεται μόλις φύγετε από αυτό. Enter: κάτω γραμμή.</span>`:""}</div>`:""}
  ${list.length?`<div class="bulk" id="bulk">${bulkIdle(list)}</div>`:""}
  <section class="panel" style="margin-top:12px">`;
  if(!sched.length){
    html += `<div class="empty"><div class="board-art"></div><strong>Δεν υπάρχουν αναθέσεις ακόμα</strong><div>Πρόσθεσε μία χειροκίνητα ή φέρε το πρόγραμμα από Excel.</div>
      <div class="actions"><button class="btn" data-act="import">${cmIcon("ul")} Εισαγωγή Excel</button><button class="btn primary" data-act="add">+ Νέα ανάθεση</button></div></div>`;
  } else if(!list.length){
    const nxt = st.week ? sched.map(m=>m.date).filter(d=>d && d>addDays(st.week,6)).sort()[0] : "";
    const prv = st.week ? sched.map(m=>m.date).filter(d=>d && d<st.week).sort().pop() : "";
    const anyInWeek = st.week && sched.some(m=>weekDays(st.week).includes(m.date));
    html += st.week && !anyInWeek
      ? `<div class="empty"><strong>Δεν υπάρχουν αγώνες αυτή την εβδομάδα</strong><div class="actions">${prv?`<button class="btn" data-act="wkgo" data-w="${weekOf(prv)}">◀ Προηγούμενη με αγώνες (${weekLabel(weekOf(prv))})</button>`:""}${nxt?`<button class="btn" data-act="wkgo" data-w="${weekOf(nxt)}">Επόμενη με αγώνες (${weekLabel(weekOf(nxt))}) ▶</button>`:""}</div></div>`
      : `<div class="empty"><strong>Καμία ανάθεση με αυτά τα φίλτρα</strong><button class="btn" data-act="clear">Καθαρισμός φίλτρων</button></div>`;
  } else if(viewNow()==="grid"){
    html += gridHtml(list);
  } else {
    html += `<div class="row head"><div>Ημ/νία</div><div>Αγώνας</div><div>Χειριστής</div><div>Βοηθός</div><div></div></div>`;
    let lastComp=null;
    list.forEach(m=>{
      if((m.comp||"")!==lastComp){ lastComp=m.comp||""; if(lastComp) html+=`<div class="comp-head">${esc(lastComp)}</div>`; }
      html += `<div class="row${m.hidden?" is-hidden":""}">
        <div class="date c-date">${whenMain(m)}<small>${whenSub(m)}</small><button type="button" class="vis${m.hidden?" off":""}" data-act="vis" data-id="${m.id}" title="${m.hidden?"Οι χρήστες δεν τη βλέπουν. Πάτα για εμφάνιση.":"Τη βλέπουν τα άτομα της ανάθεσης. Πάτα για απόκρυψη."}">${m.hidden?"Κρυφή":"Ορατή"}</button>${paySwitch(m)}</div>
        <div class="match c-match"><b class="tmw">${teamsL(m)}</b>${(teamVar(m.home)||teamVar(m.away))?`<div class="meta tfull">VAR: ${esc([teamVar(m.home)||"—", m.away?(teamVar(m.away)||"—"):""].filter(Boolean).join(" – "))}</div>`:""}<div class="meta">${[m.venue?(mapUrl(m.venue)?`<a class="mlink" href="${esc(mapUrl(m.venue))}" target="_blank" rel="noopener" title="${esc(venueOf(m.venue)?.full||"Χάρτης")}">📍 ${esc(m.venue)}</a>`:esc(m.venue)):"",esc(m.tv||""),esc(m.vc||"")].filter(Boolean).join(" · ")||"&nbsp;"}</div></div>
        ${slotHtml(m,"op")}${slotHtml(m,"as")}
        <div class="c-edit"><button class="more" data-act="edit" data-id="${m.id}" aria-label="Επεξεργασία">✎</button></div>
      </div>`;
    });
  }
  html += `</section>`;
  $("tabBody").innerHTML = html;
  if($("fSeason")) $("fSeason").onchange=e=>{st.season=e.target.value;st.month="";renderAdmin();};
  if($("fMonth")) $("fMonth").onchange=e=>{st.month=e.target.value;renderAdmin();};
  $("fPerson").onchange=e=>{st.person=e.target.value;renderAdmin();};
  $("fPaid").onchange=e=>{st.paid=e.target.value;renderAdmin();};
  $("fVis").onchange=e=>{st.vis=e.target.value;renderAdmin();};
  $("fSearch").oninput=e=>{st.q=e.target.value;renderAdmin();};
}
/* ---------- «Πίνακας»: the programme as an editable sheet ----------
   Each cell saves itself when you leave it (change event), through the same syncAndSave as the form:
   users' copies, «Άλλαξε», emails and «Το είδε» work exactly the same. */
const GCOLS = [
  ["date","Ημ/νία","date",128],["time","Ώρα","text",66],["comp","Διοργάνωση","text",160,1],["home","Γηπεδούχος","text",160,1],["away","Φιλοξενούμενη","text",160,1],
  ["venue","Γήπεδο","text",130,1],["tv","Κάλυψη","text",100,1],["vc","VAR","text",84,1],
  ["op","Χειριστής","text",170,1],["fee_op","€","num",58],["paid_op","Πλ.","check",40],
  ["as","Βοηθός","text",170,1],["fee_as","€","num",58],["paid_as","Πλ.","check",40],
  ["pay","Πληρωμή","pay",104],["visible","Ορατή","check",52],["notes","Σημειώσεις","text",200]];
function gridHtml(list){
  const cell = (m,[f,l,t,w,dl]) => {
    const id = `g-${m.id}-${f}`, base = `id="${id}" data-g="${f}" data-id="${m.id}" aria-label="${esc(l)}"`;
    if(t==="pay") return `<td><select ${base} class="gsel"><option value="">—</option>${Object.entries(PAYM).map(([k,l])=>`<option value="${k}" ${m.pay===k?"selected":""}>${l}</option>`).join("")}</select></td>`;
    if(t==="check"){ const on = f==="visible" ? !m.hidden : !!m[f]; return `<td class="ck"><input type="checkbox" ${base} ${on?"checked":""} ${f.startsWith("paid_")&&!m[f.slice(5)]?"disabled":""}></td>`; }
    const v = t==="num" ? (m[f]??"") : f==="date" ? (m.date||"") : f==="time" ? (m.time||m.timeText||"") : (m[f]??"");
    const flag = (f==="op"||f==="as") && m[f] && unavailOn(m[f], m.date) ? " unav" : "";
    return `<td${dl?' class="dd"':""}><input ${base} class="${flag.trim()}" type="${t==="date"?"date":t==="num"?"number":"text"}" ${t==="num"?'inputmode="decimal" min="0" step="1"':""} value="${esc(v)}" autocomplete="off"${dl?' role="combobox" aria-autocomplete="list" aria-expanded="false"':""}>${dl?`<button type="button" class="gdd" tabindex="-1" data-dd="${id}" aria-label="Όλες οι επιλογές">▾</button>`:""}</td>`;
  };
  return `<div class="gwrap" id="gwrap"><table class="grid"><colgroup>${GCOLS.map(c=>`<col style="width:${c[3]}px">`).join("")}<col style="width:40px"></colgroup>

async function exportStats(){

      ...ppl.map(p=>[p.name,p.n,p.op,p.as,p.fee,p.paid,p.due,p.last?fmtDate(p.last):""]), ["Σύνολο",all.n,all.op,all.as,all.fee,all.paid,all.due,""]], [26,11,11,9,12,14,13,16]);

    const sec = (key,label,fmt)=>[[label,"Αναθέσεις","Χειριστής","Βοηθός","Αμοιβές (€)","Πληρώθηκαν (€)","Εκκρεμούν (€)"],
      ...[...groupBy(slots,key).entries()].sort((a,b)=>String(a[0]).localeCompare(String(b[0]),"el")).map(([k,v])=>{ const t=statTotals(v); return [fmt(k),t.n,t.op,t.as,t.fee,t.paid,t.due]; })];
    add("Ανά μήνας", sec(x=>(x.date||"").slice(0,7),"Μήνας",monthLabel), [18,11,11,9,12,14,13]);
