/* shrink any picture to a 128×128 logo (transparent background kept) so it fits in the team's record */
async function logoFromFile(file){
  const url = URL.createObjectURL(file);
  try{
    const img = await new Promise((ok,no)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=no; i.src=url; });
    const S=128, c=document.createElement("canvas"); c.width=c.height=S; const g=c.getContext("2d");
    const w0=img.naturalWidth||img.width||S, h0=img.naturalHeight||img.height||S, k=Math.min(S/w0, S/h0);
    const w1=Math.max(1,Math.round(w0*k)), h1=Math.max(1,Math.round(h0*k));
    g.imageSmoothingQuality="high"; g.drawImage(img,(S-w1)/2,(S-h1)/2,w1,h1);
    let d=c.toDataURL("image/webp",0.9); if(!d.startsWith("data:image/webp")) d=c.toDataURL("image/png");
    return d;
  } finally { URL.revokeObjectURL(url); }
}

function bindNotify(){

    if(n.email && !/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(n.endpoint)){ toast("Βάλε πρώτα τη διεύθυνση της υπηρεσίας αποστολής"); return; }
    try{ await db.doc("config/notify").set(n); notify=n; toast(n.email?"Οι ειδοποιήσεις email ενεργοποιήθηκαν":"Οι ειδοποιήσεις email απενεργοποιήθηκαν"); }catch{ toast("Η αποθήκευση απέτυχε"); } };

    try{
      const r = await mail.send(ep, [{to:me.email, subject:"Check Mate: δοκιμαστικό email", html:mailHtml({name:me.name}, [{type:"test"}])}], senderOpts());
      if(r.account && r.account!==notify.account && ep===notify.endpoint){ try{ await db.doc("config/notify").set({...notify, account:r.account}); }catch{} }
      toast(`Στάλθηκε στο ${me.email}${r.account?" από "+r.account:""}`);
    }catch(err){ toast("Δεν στάλθηκε: " + (err?.message==="forbidden" ? "ο λογαριασμός σου δεν αναγνωρίστηκε ως διαχειριστής" : "έλεγξε τη διεύθυνση")); }
    finally{ if($("nTest")) $("nTest").disabled = false; }
  };
}
const NOTE_FIELDS = [["date","Ημερομηνία"],["time","Ώρα"],["home","Γηπεδούχος"],["away","Φιλοξενούμενη"],["comp","Διοργάνωση"],["venue","Γήπεδο"],["tv","Κάλυψη"],["vc","VAR"],["partner","Συνεργάτης"],["fee","Αμοιβή"],["notes","Σημειώσεις"]];
/* emails wait 4 s (to group changes) in `outbox`; they are also kept on this device until sent,
   so closing the app right after a change does not lose them: they go out the next time it opens */
let outbox = (()=>{ try{ return JSON.parse(localStorage.getItem("cm.outbox")||"{}")||{}; }catch{ return {}; } })(), inflight = {}, outboxTimer = null, muteNotes = 0, flushTries = 0;
function saveOutbox(){ try{ const all = {...inflight}; for(const [k,v] of Object.entries(outbox)) all[k] = [...(all[k]||[]), ...v];
  if(Object.keys(all).length) localStorage.setItem("cm.outbox", JSON.stringify(all)); else localStorage.removeItem("cm.outbox"); }catch{} }
function queueNote(uid, ev){
  if(muteNotes || !uid || !notify.email || !notify.endpoint) return;
  (outbox[uid] = outbox[uid] || []).push(ev); saveOutbox();
  clearTimeout(outboxTimer); outboxTimer = setTimeout(flushNotes, 4000);
}
/* who gets the email: the person in the role (by name), at their linked account's email or the email set in Άτομα */
function emailForName(key){ const r = rosterByNorm()[key]; if(!r) return null; const uid = links[r.id]; return (uid && profilesAll[uid]?.email) || contacts[r.id] || null; }
function nameForKey(key){ const r = rosterByNorm()[key]; const uid = r && links[r.id]; return (uid && profilesAll[uid]?.name) || ""; }   // programme names are "SURNAME I.", so no greeting by name
function noteChanges(prev, m){
  /* games that have already been played: only payment changes are worth an email */
  const played = ((m||prev)?.date||"9999") < today() && ((prev||m)?.date||"9999") < today();
  for(const r of ["op","as"]){
    const o = prev && !prev.hidden && prev[r] ? norm(prev[r]) : null, n = m && !m.hidden && m[r] ? norm(m[r]) : null;
    const oi = o ? itemFor(prev, r) : null, ni = n ? itemFor(m, r) : null;
    if(o && o !== n && !played) queueNote(o, {type:"removed", item:oi});
    if(n && n !== o && !played) queueNote(n, {type:"added", item:ni});
    if(n && n === o){
      const ch = NOTE_FIELDS.filter(([k]) => String(oi[k] ?? "") !== String(ni[k] ?? "")).map(([k,l]) => ({k, l, from:oi[k], to:ni[k]}));
      if(ch.length && !played) queueNote(n, {type:"changed", item:ni, ch});
      if(!!oi.paid !== !!ni.paid) queueNote(n, {type: ni.paid ? "paid" : "unpaid", item:ni});
    }
  }
}
const DEFAULT_FOOTER = "Παρακαλούμε, μην απαντάτε σε αυτό το email, καθώς έχει αποκλειστικά ενημερωτικό χαρακτήρα.\nΓια οποιαδήποτε διευκρίνιση, παρακαλούμε επικοινωνήστε τηλεφωνικά με τον κ. Νικόλα Παπαχατζή ή τον κ. Μιχάλη Τσιντομηνά.";
const EV_TITLE = {added:"Νέα ανάθεση", removed:"Ακύρωση ανάθεσης", changed:"Αλλαγή στην ανάθεση", paid:"Πληρώθηκε", unpaid:"Η πληρωμή αναιρέθηκε", test:"Δοκιμαστικό μήνυμα"};

function mailHtml(p, evs){

      .filter(([,v]) => v).map(([k,v]) => `<tr><td style="padding:3px 12px 3px 0;color:#5d6b84;white-space:nowrap;vertical-align:top">${k}</td><td style="padding:3px 0">${k==="Γήπεδο" ? venueMailHtml(v) : h(v)}</td></tr>`).join("");

const senderOpts = () => ({senderName: notify.senderName || "Check Mate", replyTo: notify.replyTo || ""});
function subjectFor(evs){
  if(evs.length === 1){ const e = evs[0], i = e.item || {}; return `Check Mate: ${EV_TITLE[e.type]} – ${evMatch(i)}${i.date ? ", " + dayName(i.date) + " " + fmtDate(i.date).slice(0,5) : ""}`; }
  return `Check Mate: ${evs.length} αλλαγές στις αναθέσεις σου`;
}
async function flushNotes(){
  clearTimeout(outboxTimer); outboxTimer = null;
  if(!Object.keys(outbox).length) return;
  /* not ready yet (just opened): try again shortly */
  if(!mail || !notify.endpoint || !ready.roster || !ready.links || !ready.profiles || !ready.contacts){ if(flushTries++ < 20) outboxTimer = setTimeout(flushNotes, 3000); return; }
  const box = outbox; outbox = {}; inflight = box;
  const msgs = [], keys = [], missing = [];
  for(const [key, evs] of Object.entries(box)){
    const to = emailForName(key);
    if(!to){ missing.push(rosterByNorm()[key]?.name || key); continue; }
    msgs.push({to, subject:subjectFor(evs), html:mailHtml({name:nameForKey(key)}, evs)}); keys.push(key);
  }
  if(missing.length) setTimeout(()=>toastLong(`Δεν στάλθηκε email σε: ${missing.join(", ")} — δεν έχει email. Συμπλήρωσέ το στα «Άτομα».`), msgs.length ? 3200 : 0);
  if(!msgs.length){ inflight = {}; saveOutbox(); return; }
  try{ const r = await mail.send(notify.endpoint, msgs, senderOpts()); inflight = {}; saveOutbox(); toast(`Στάλθηκαν ${r.sent ?? msgs.length} email ειδοποίησης`); }
  catch(err){ console.warn("notify", err);
    for(const k of keys) outbox[k] = [...box[k], ...(outbox[k]||[])];   // keep them; sent at the next attempt
    inflight = {}; saveOutbox(); toast("Τα email δεν στάλθηκαν τώρα· θα ξαναδοκιμάσει αργότερα"); if(flushTries++ < 20) outboxTimer = setTimeout(flushNotes, 60000); }
}
document.addEventListener("visibilitychange", () => { if(document.visibilityState==="hidden" && outboxTimer) flushNotes(); });

async function syncAndSave(m, prev){

const uniqNorm = arr => { const seen=new Set(), out=[]; arr.forEach(v=>{ const s=(v||"").trim(), k=norm(s); if(s && !seen.has(k)){ seen.add(k); out.push(s); } }); return out.sort((a,b)=>a.localeCompare(b,"el")); };
/* the saved lists (tab «Ομάδες & γήπεδα») are the source; until they exist, names come from the programme */
function teamNames(){ return teamList.length ? uniqNorm(teamList.map(t=>t.name)) : uniqNorm(sched.flatMap(m=>[m.home,m.away])); }
/* venues: name = as written in the programme (often an acronym, e.g. ΣΕΦ), full name, address, map (Google Maps link or "lat,lng") */
const venueOf = name => { const k=norm(name); return k ? venues.find(v=>norm(v.name)===k) || null : null; };
const COORD = /^\s*-?\d{1,2}\.\d+\s*,\s*-?\d{1,3}\.\d+\s*$/;
function venueQuery(v){ if(v.map && COORD.test(v.map)) return v.map.replace(/\s/g,""); return [v.full||v.name, v.address].filter(Boolean).join(", "); }
const hasPlace = v => !!(v && (v.full || v.address || v.map));
function mapUrl(name){ const v=venueOf(name); if(!hasPlace(v)) return ""; if(/^https?:\/\//i.test(v.map||"")) return v.map; return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(venueQuery(v)); }
function mapEmbed(name){ const v=venueOf(name); if(!v || !(v.full || v.address || COORD.test(v.map||""))) return ""; return "https://maps.google.com/maps?q="+encodeURIComponent(venueQuery(v))+"&z=15&output=embed"; }
function venueNames(){ return venues.length ? uniqNorm(venues.map(v=>v.name)) : uniqNorm([...teamList.map(t=>t.venue), ...sched.map(m=>m.venue)]); }
let listsReady={teams:false,venues:false}, listsSeeded=false, dedupeDone=false;
/* teams & venues: one name = one entry. Every creation goes through one queue and is re-checked right
   before writing, so the first-run fill, an Excel import and the forms can never add the same name twice.
   If the name already exists, only its empty fields are filled. Returns {id, created}. */
let listQ = Promise.resolve();
const queued = fn => { const p = listQ.then(fn, fn); listQ = p.catch(()=>{}); return p; };
const listOf = kind => kind==="teams" ? teamList : venues;
const filled = v => v!=="" && v!=null;
function addListDoc(kind, name, data={}){
  return queued(async ()=>{
    const ex = listOf(kind).find(x=>norm(x.name)===norm(name));
    if(ex){
      const upd={}; Object.entries(data).forEach(([f,v])=>{ if(filled(v) && !filled(ex[f])) upd[f]=v; });
      if(Object.keys(upd).length){ await w(()=>db.doc(`${kind}/${ex.id}`).update(upd)); Object.assign(ex,upd); }
      return {id:ex.id, created:false};
    }
    const doc={name, ...data}; const ref=await w(()=>db.collection(kind).add(doc));
    const arr=listOf(kind); if(!arr.some(x=>x.id===ref.id)) arr.push({id:ref.id, ...doc});
    return {id:ref.id, created:true};
  });
}
/* clean up entries that were already doubled: keep the one with the most details, copy over any field
   it lacks from the others, delete the rest. The programme refers to teams/venues by name, so nothing breaks. */
function dedupeLists(){
  if(dedupeDone || !listsReady.teams || !listsReady.venues) return; dedupeDone=true;
  return queued(async ()=>{
    let merged=0;
    for(const kind of ["teams","venues"]){
      const groups=new Map();
      listOf(kind).forEach(x=>{ const k=norm(x.name); if(!k) return; if(!groups.has(k)) groups.set(k,[]); groups.get(k).push(x); });
      for(const g of groups.values()){
        if(g.length<2) continue;
        const score=x=>Object.entries(x).filter(([f,v])=>f!=="id" && f!=="name" && filled(v)).length;
        g.sort((a,b)=>score(b)-score(a) || a.id.localeCompare(b.id));
        const keep=g[0], add={};
        g.slice(1).forEach(x=>Object.entries(x).forEach(([f,v])=>{ if(f!=="id" && f!=="name" && filled(v) && !filled(keep[f]) && add[f]===undefined) add[f]=v; }));
        try{
          if(Object.keys(add).length){ await w(()=>db.doc(`${kind}/${keep.id}`).update(add)); Object.assign(keep,add); }
          for(const x of g.slice(1)){ await w(()=>db.doc(`${kind}/${x.id}`).delete()); merged++; }
        }catch(e){ console.warn("dedupe", e); }
      }
    }
    if(merged){ toast(`Ενοποιήθηκαν ${merged} διπλές καταχωρίσεις σε ομάδες και γήπεδα`); if(tab==="lists") renderAdmin(); }
  });
}

/* the same person under two names: move every assignment of src to dst, keep one account linked, delete src. No emails. */
async function mergePerson(src, dst, keepUid){
  const sk=norm(src.name), involved=new Set([links[src.id], links[dst.id], keepUid].filter(Boolean));
  // links: src goes away; dst is linked to keepUid (or to nobody)
  if(links[src.id]){ await w(()=>db.doc(`links/${src.id}`).delete()); delete links[src.id]; }
  for(const [r,u] of Object.entries(links)) if(keepUid && u===keepUid && r!==dst.id){ await w(()=>db.doc(`links/${r}`).delete()); delete links[r]; }
  const prevDst = links[dst.id];
  if(keepUid){
    await w(()=>db.doc(`links/${dst.id}`).set({uid:keepUid})); links[dst.id]=keepUid;
    await w(()=>db.doc(`claims/${keepUid}`).set({rid:dst.id, status:"approved", at:Date.now(), decidedAt:Date.now()}, {merge:true}));
  } else if(prevDst){ await w(()=>db.doc(`links/${dst.id}`).delete()); delete links[dst.id]; }
  for(const u of involved) if(u!==keepUid){ await w(()=>db.doc(`claims/${u}`).delete()).catch(()=>{}); }
  // notification email of src, if dst has none
  if(contacts[src.id] && !contacts[dst.id]){ await w(()=>db.doc(`contacts/${dst.id}`).set({email:contacts[src.id]})); contacts[dst.id]=contacts[src.id]; }
  // assignments
  const list = sched.filter(m=>norm(m.op)===sk || norm(m.as)===sk || ["op","as"].some(r=>m.sync?.[r] && involved.has(m.sync[r])) || norm(m.op)===norm(dst.name) || norm(m.as)===norm(dst.name));
  let n=0;
  muteNotes++;
  try{
    for(const m of list){
      const upd={...m}; let ch=false;
      for(const r of ["op","as"]) if(norm(m[r])===sk){ upd[r]=dst.name; ch=true; }
      if(ch){ upd.updatedAt=Date.now(); n++; }
      await syncAndSave(upd, m);
    }
  } finally { muteNotes--; }
  await w(()=>db.doc(`roster/${src.id}`).delete());
  if(contacts[src.id]) await w(()=>db.doc(`contacts/${src.id}`).delete()).catch(()=>{});
  return n;
}

function setupCombo(inp, o){
  const wrap=inp.closest(".combo"), list=wrap.querySelector(".combo-list"), btn=wrap.querySelector(".combo-btn");
  let items=[], active=-1;
  const close=()=>{ list.hidden=true; inp.setAttribute("aria-expanded","false"); active=-1; };
  const pick=v=>{ const before=inp.value; inp.value=v; close(); o.onPick?.(v, before); inp.dispatchEvent(new Event("change",{bubbles:true})); };
  function render(filter){
    const q=norm(filter||""), names=o.source();
    const shown=names.filter(n=>!q||norm(n).includes(q));
    const exact=names.some(n=>norm(n)===q);
    items=[];
    if(inp.value.trim()) items.push({v:"",label:o.noneLabel||"— Κανένα —",cls:"none"});
    shown.forEach(n=>items.push({v:n,label:n,hint:o.hint?.(n)||""}));
    if(q && !exact) items.push({v:filter.trim(),label:`+ Νέο: «${filter.trim()}»`,cls:"new"});
    list.innerHTML = items.length ? items.map((it,i)=>`<li role="option" id="${inp.id}-o${i}" data-i="${i}" class="${it.cls||""}" aria-selected="${i===active}">${esc(it.label)}${it.hint?`<small class="${it.hint.startsWith("⚠")?"warn":""}">${esc(it.hint)}</small>`:""}</li>`).join("")
      : `<li class="none">${o.emptyLabel||"Η λίστα είναι άδεια — γράψε ένα όνομα"}</li>`;
    list.hidden=false; inp.setAttribute("aria-expanded","true");
    const a=list.querySelector('[aria-selected="true"]'); if(a){ a.scrollIntoView({block:"nearest"}); inp.setAttribute("aria-activedescendant",a.id); }
  }
  inp.addEventListener("input",()=>{ active=-1; render(inp.value); });
  inp.addEventListener("focus",()=>{ active=-1; render(""); });
  inp.addEventListener("click",()=>{ if(list.hidden) render(""); });
  btn.addEventListener("mousedown",e=>e.preventDefault());
  btn.addEventListener("click",()=>{ if(list.hidden){ inp.focus(); render(""); } else close(); });
  list.addEventListener("mousedown",e=>e.preventDefault());
  list.addEventListener("click",e=>{ const li=e.target.closest("li[data-i]"); if(li) pick(items[+li.dataset.i].v); });
  inp.addEventListener("keydown",e=>{
    if(e.key==="ArrowDown"||e.key==="ArrowUp"){ e.preventDefault(); if(list.hidden){ render(inp.value); }
      const n=items.length; if(!n) return; active = e.key==="ArrowDown" ? (active+1)%n : (active<=0?n-1:active-1); render(inp.value); }
    else if(e.key==="Enter" && !list.hidden && active>=0){ e.preventDefault(); pick(items[active].v); }
    else if(e.key==="Escape" && !list.hidden){ e.preventDefault(); e.stopPropagation(); close(); }
    else if(e.key==="Tab") close();
  });
  inp.addEventListener("blur",()=>setTimeout(()=>{ if(document.activeElement!==inp) close(); },120));
  return {close};
}

  const k=norm(team); if(!k) return "";

  return Object.entries(c).sort((a,b)=>b[1]-a[1])[0]?.[0]||"";
}

let impRows=[];
/* Excel with teams: Ομάδα | VAR | Έδρα (header row optional; columns found by their titles when present) */
async function importTeams(file){
  try{
    const X = await loadXLSX();
    const wb = X.read(await file.arrayBuffer(), {type:"array"});
    const rows = X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, defval:"", raw:false}).map(r=>r.map(c=>String(c??"").trim())).filter(r=>r.some(Boolean));
    if(!rows.length){ toast("Το αρχείο είναι άδειο"); return; }
    let ci = {name:0, var:1, venue:2}, start = 0;
    const head = rows[0].map(c=>c.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase());
    if(head.some(c=>/VAR|ΑΡΚΤΙΚ|ΣΥΝΤΟΜ|ΟΜΑΔ|ΟΝΟΜΑ|ΕΔΡΑ|ΓΗΠΕΔ|ΚΩΔ/.test(c))){
      start = 1; const f = re => head.findIndex(c=>re.test(c));
      const n=f(/ΟΜΑΔ|ΟΝΟΜΑ/), va=f(/VAR|ΒΑΡ|ΑΡΚΤΙΚ|ΣΥΝΤΟΜ|ΚΩΔ|CHALLENGE/), ve=f(/ΕΔΡΑ|ΓΗΠΕΔ/);
      if(n>=0) ci.name=n; if(va>=0 && va!==ci.name) ci.var=va; if(ve>=0) ci.venue=ve;
    }
    let added=0, updated=0; const touched=[], newVenues=[];
    for(const r of rows.slice(start)){
      const name = r[ci.name]; if(!name) continue;
      const d = {}; if(r[ci.var]) d.var=r[ci.var]; if(r[ci.venue]){ d.venue=r[ci.venue]; newVenues.push(d.venue); }
      const ex = teamList.find(t=>norm(t.name)===norm(name));
      if(ex){ if(Object.entries(d).some(([k,v])=>ex[k]!==v)){ await w(()=>db.doc(`teams/${ex.id}`).update(d)); Object.assign(ex,d); updated++; touched.push(name); } }
      else { const r = await addListDoc("teams", name, d); r.created ? added++ : updated++; touched.push(name); }
    }
    if(newVenues.length) await ensureLists([], newVenues);
    await resyncTeams(touched);
    toast(`Ομάδες: ${added} νέες, ${updated} ενημερώθηκαν`); renderAdmin();
  }catch(err){ console.error(err); toast("Δεν διαβάστηκε το αρχείο. Ελέγξτε ότι είναι Excel ή CSV."); }
}
/* Excel with venues: Αρκτικόλεξο | Πλήρες όνομα | Διεύθυνση | Χάρτης. Header row optional; columns are found by their titles when present. */
async function importVenues(file){
  try{
    const X = await loadXLSX();
    const wb = X.read(await file.arrayBuffer(), {type:"array"});
    const rows = X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, defval:"", raw:false}).map(r=>r.map(c=>String(c??"").trim())).filter(r=>r.some(Boolean));
    if(!rows.length){ toast("Το αρχείο είναι άδειο"); return; }
    let ci = {name:0, full:1, address:2, map:3}, start = 0;
    const head = rows[0].map(c=>c.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase());
    const isHead = head.some(c=>/ΑΡΚΤΙΚ|ΣΥΝΤΟΜ|ΓΗΠΕΔ|ΟΝΟΜΑ|ΔΙΕΥΘ|ΧΑΡΤ|MAP|ΚΩΔ/.test(c)) && !rows[0].some(c=>/^https?:/i.test(c));
    if(isHead){
      start = 1; const f = re => head.findIndex(c=>re.test(c));
      const n=f(/ΑΡΚΤΙΚ|ΣΥΝΤΟΜ|ΚΩΔ/), fu=f(/ΠΛΗΡ|ΟΝΟΜΑΣΙΑ|ΠΕΡΙΓΡ|ΟΝΟΜΑ/), ad=f(/ΔΙΕΥΘ|ΠΟΛΗ|ΠΕΡΙΟΧ/), mp=f(/ΧΑΡΤ|MAP|ΣΥΝΔΕΣ|ΣΥΝΤΕΤ|LINK/);
      if(n>=0) ci.name=n; if(fu>=0 && fu!==ci.name) ci.full=fu; if(ad>=0) ci.address=ad; if(mp>=0) ci.map=mp;
    }
    let added=0, updated=0; const touched=[];
    for(const r of rows.slice(start)){
      const name = r[ci.name]; if(!name) continue;
      const d = {}; for(const k of ["full","address","map"]){ const v=r[ci[k]]; if(v) d[k]=v; }
      if(!d.map){ const link=r.find((c,i)=>i!==ci.name && (/^https?:\/\//i.test(c) || COORD.test(c))); if(link) d.map=link; }
      const ex = venueOf(name);
      if(ex){ if(Object.keys(d).length && Object.entries(d).some(([k,v])=>ex[k]!==v)){ await w(()=>db.doc(`venues/${ex.id}`).update(d)); Object.assign(ex,d); updated++; touched.push(name); } }
      else { const r = await addListDoc("venues", name, d); r.created ? added++ : updated++; touched.push(name); }

async function readFile(file){
  $("impErr").hidden=true;
  try{
    const X = await loadXLSX();
    const wb = X.read(await file.arrayBuffer(), {type:"array"});
    let parsed={rows:[],skipped:[]};
    for(const name of wb.SheetNames){
      const rows = X.utils.sheet_to_json(wb.Sheets[name], {header:1, raw:true, defval:""});
      const p = P.parseRows(rows); parsed.rows.push(...p.rows); parsed.skipped.push(...p.skipped);
    }
    if(!parsed.rows.length){ $("impErr").hidden=false; $("impErr").textContent="Δεν βρέθηκαν αγώνες στο αρχείο. Έλεγξε ότι η 1η στήλη έχει ημερομηνία (π.χ. 08.04.2026)."; return; }
    const known = rosterByNorm();
    const exMap = pairImport(parsed.rows);
    const seenLine = new Set();
    impRows = parsed.rows.map((r,i)=>{
      const key=matchKey(r); const ex=exMap.get(i);
      let status = ex ? (["date","time","dateText","timeText","venue","tv","vc"].some(k=>(ex[k]||"")!==(r[k]||"")) || !!ex.dateTbc!==!!r.dateTbc || norm(ex.op)!==norm(r.op) || norm(ex.as)!==norm(r.as) ? "upd":"same") : "new";
      const line=[key, r.date||r.dateText||"", r.time||r.timeText||""].join("|");
      if(seenLine.has(line)) status="dup"; seenLine.add(line);
      return {...r, key, ex, status};
    });
    const n = s=>impRows.filter(r=>r.status===s).length;
    const unknown = uniq(impRows.flatMap(r=>[r.op,r.as]).filter(x=>x && !known[norm(x)]));
    $("impSummary").innerHTML = `<b style="color:var(--ink)">${impRows.length}</b> αγώνες στο αρχείο: <span class="st new">${n("new")} νέοι</span> · <span class="st upd">${n("upd")} με αλλαγές</span> · <span class="st same">${n("same")} ίδιοι</span>${n("dup")?` · ${n("dup")} διπλές γραμμές (παραλείπονται)`:""}`
      + (impRows.some(r=>r.warn)?`<br><span class="err">⚠ ${impRows.filter(r=>r.warn).length} αγώνες με ύποπτη ημερομηνία (π.χ. γρ. ${impRows.find(r=>r.warn).line}: ${fmtDate(impRows.find(r=>r.warn).date)}) – διόρθωσέ τες στο Excel ή μετά την εισαγωγή.</span>`:"")
      + (unknown.length?`<br><span class="unk">Νέα ονόματα που θα προστεθούν: ${unknown.map(esc).join(", ")}</span>`:"")
      + (parsed.skipped.length?`<br><span class="err">Παραλείφθηκαν ${parsed.skipped.length} γραμμές: ${parsed.skipped.slice(0,3).map(s=>`γρ. ${s.line}`).join(", ")}${parsed.skipped.length>3?"…":""}</span>`:"");
    const lab={new:"ΝΕΟΣ",upd:"ΑΛΛΑΓΗ",same:"ΙΔΙΟΣ",dup:"ΔΙΠΛΟΣ"};
    let lastComp=null;
    $("impBody").innerHTML = impRows.map(r=>{
      const head = r.comp!==lastComp ? (lastComp=r.comp, `<tr><td colspan="9" style="background:var(--blue-bg);color:var(--blue);font-weight:600">${esc(r.comp||"—")}</td></tr>`) : "";
      const nm = x => x ? `<span class="${known[norm(x)]?"":"unk"}">${esc(x)}</span>` : `<span class="note">—</span>`;
      return head+`<tr><td><span class="st ${r.status}">${lab[r.status]}</span></td><td${r.warn?` class="err" title="${esc(r.warn)}"`:""}>${r.warn?"⚠ ":""}${esc(r.dateText||fmtDate(r.date))}${r.dateTbc?` <span class="note" title="Ημερομηνία αγωνιστικής">~</span>`:""}</td><td>${esc(r.time||r.timeText)}</td><td>${teams(r)}</td><td>${esc(r.venue)}</td><td>${esc(r.tv)}</td><td>${esc(r.vc)}</td><td>${nm(r.op)}</td><td>${nm(r.as)}</td></tr>`;
    }).join("");
    $("impStep1").hidden=true; $("impStep2").hidden=false;
    const todo = n("new")+n("upd");
    $("impGo").hidden = !todo; $("impGo").disabled=false; $("impGo").textContent = `Εισαγωγή ${todo} αγώνων`;
  }catch(err){ $("impErr").hidden=false; $("impErr").textContent = err?.message==="load" ? "Δεν φορτώθηκε ο αναγνώστης Excel. Έλεγξε τη σύνδεση και δοκίμασε ξανά." : "Το αρχείο δεν διαβάστηκε. Αποθήκευσέ το ως .xlsx και δοκίμασε ξανά."; }
}

/* «Το είδε»: when the user's page shows an upcoming assignment (new or changed), the time is saved in profiles/<uid>.seen,
   so the administrator knows the person has seen it. Nothing to press. */
async function markSeen(list){
  if(!myUnavLoaded || seenWriting || !me) return;
  const now = Date.now(), upd = {};
  list.forEach(i => { if(!((mySeen[i.id]||0) >= (i.changedAt||0) && mySeen[i.id])) upd[i.id] = now; });
  if(!Object.keys(upd).length) return;
  seenWriting = true;
  try{
    const keep = new Set(myItems.map(i=>i.id)), all = {...mySeen, ...upd};
    const tidy = Object.keys(all).some(k=>!keep.has(k));
    if(tidy){ const pruned = {}; Object.keys(all).filter(k=>keep.has(k)).forEach(k=>pruned[k]=all[k]);   // forget finished/removed assignments
      await db.doc(`profiles/${me.id}`).update({seen:pruned}).catch(()=>db.doc(`profiles/${me.id}`).set({seen:pruned}, {merge:true})); }
    else await db.doc(`profiles/${me.id}`).set({seen:upd}, {merge:true});
  }catch(err){ console.warn("seen", err); }
  finally{ seenWriting = false; }
}

/* Greek first names in the vocative: Γιάννης → Γιάννη, Κώστας → Κώστα, Γιώργος → Γιώργο, Αλέξανδρος → Αλέξανδρε */
function vocative(n){
  if(!/^[\u0370-\u03ff\u1f00-\u1fff]+$/.test(n||"")) return n||"";
  if(/[ηαήά]ς$/.test(n)) return n.slice(0,-1);
  if(/ος$/.test(n)){   /* stress two syllables before the end (Αλέξανδρος, Νικόλαος) → -ε, otherwise → -ο */
    const k = n.search(/[άέήίόύώ]/); if(k<0) return n.slice(0,-1);
    const after = (n.slice(k+1).replace(/ου|αι|ει|οι|υι/g,"V").match(/[αεηιουωV]/g)||[]).length;
    return after>=2 ? n.slice(0,-2)+"ε" : n.slice(0,-1);
  }
  return n;
}

      <div class="cell"><div class="k">Εκκρεμούν</div><div class="v or">${eur(total-paid)}</div></div>
    </section>
    <div class="sechead"><div><div class="hi">${greet}</div><h2 class="sec">Επόμενες αναθέσεις</h2></div></div>
    ${upcoming.length?`<div class="cards">${upcoming.map((i,k)=>card(i,k===0)).join("")}</div>`:`<div class="panel"><div class="empty"><strong>Δεν έχεις επόμενες αναθέσεις</strong><div>Θα εμφανιστούν εδώ μόλις σε ορίσει ο διαχειριστής.</div></div></div>`}
    ${unavPanel()}
    ${phonePanel()}
    ${myStatsPanel()}
    ${past.length?`<div class="actions"><button class="btn" id="togglePast">${showPast?"Απόκρυψη":"Προβολή"} προηγούμενων (${past.length})</button></div>
      ${showPast?`<div class="cards">${past.map(i=>card(i,false)).join("")}</div>`:""}`:""}
  </div>`;
  const tp=$("togglePast"); if(tp) tp.onclick=()=>{ showPast=!showPast; renderUser(); };
  if(document.visibilityState==="visible") markSeen(upcoming);
  renderUnavUser(); bindMyStats();
}
})();

}
/* ===== boot: read the mode the admin chose and mount it ===== */
(async () => {
  const HINT = {log:"Οι χρήστες καταγράφουν μόνοι τους τους αγώνες τους.", assign:"Ο διαχειριστής ορίζει τις αναθέσεις· οι χρήστες βλέπουν μόνο τις δικές τους."};
  const db = await claude.use("db"), user = await claude.use("user");
  const isAdmin = user ? !!(await user.canEdit()) : false;
  let mode = "assign";
  if(db){ try{ const s = await db.doc("config/app").get(); if(s.exists && (s.data().mode==="log"||s.data().mode==="assign")) mode = s.data().mode; }catch{} }
  const root = document.getElementById("root");
  root.replaceChildren(document.getElementById("tpl-"+mode).content.cloneNode(true));
  (mode==="log" ? runLog : runAssign)();
  /* the mode bar is hidden while "assign" is active; the log mode is switched on from Άτομα → Ημερολόγιο αγώνων */
  if(isAdmin && (mode==="log" || /[?&]modes/.test(location.search))){
    const bar = document.getElementById("modebar"); bar.hidden = false;
    bar.querySelectorAll("[data-mode]").forEach(b=>{
      b.setAttribute("aria-pressed", String(b.dataset.mode===mode));
      b.onclick = async () => {
        if(b.dataset.mode===mode) return;
        const label = b.textContent;
        if(!confirm(`Αλλαγή λειτουργίας σε «${label}» για όλους τους χρήστες;\nΤα δεδομένα της άλλης λειτουργίας δεν χάνονται.`)) return;
        try{ await db.doc("config/app").set({mode:b.dataset.mode, changedAt:Date.now()}); location.reload(); }
        catch{ alert("Η αλλαγή απέτυχε. Δοκίμασε ξανά."); }
      };
    });
    document.getElementById("modehint").textContent = HINT[mode];
  }
  if(db) db.doc("config/app").onSnapshot(s => { const m = s.exists ? s.data().mode : "assign"; if((m==="log"||m==="assign") && m!==mode) location.reload(); }, ()=>{});
})();
</script>
